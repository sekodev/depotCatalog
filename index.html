<!-- Fix (favicon on load): build the active depot's emoji favicon BEFORE first paint,
     so refresh/first load shows it too. dcSetEmojiFavicon is the shared helper the main
     app reuses; everything is try/catch'd so any failure silently leaves icon.png. -->
<script>
(function(){
  function dcSetEmojiFavicon(emoji){
    try {
      var old = document.querySelectorAll('link[rel="icon"]');
      if (!old.length) return false;
      var c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      var ctx = c.getContext('2d');
      if (!ctx) return false; // no canvas => static icon.png stays
      ctx.clearRect(0, 0, 64, 64);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '52px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(emoji, 32, 35);
      var url = c.toDataURL('image/png');
      if (!url || url.indexOf('data:image/png') !== 0) return false;
      // REPLACE the link element(s): mutating href alone is unreliable across browsers
      for (var i = 0; i < old.length; i++){
        if (old[i].parentNode) old[i].parentNode.removeChild(old[i]);
      }
      var nl = document.createElement('link');
      nl.setAttribute('rel', 'icon');
      nl.setAttribute('type', 'image/png');
      nl.setAttribute('href', url);
      document.head.appendChild(nl);
      window.__dcFaviconEmoji = emoji; // last successful draw (shared with the main app)
      return true;
    } catch(e){ return false; }
  }
  window.dcSetEmojiFavicon = dcSetEmojiFavicon;
  try {
    var emoji = '📦'; // fallback
    var raw = localStorage.getItem('depotCatalog.data.v2');
    if (raw){
      var d = JSON.parse(raw);
      if (d && typeof d.activeDepotId === 'number'){
        var icons = (d.depotIcons && typeof d.depotIcons === 'object') ? d.depotIcons : {};
        var v = icons[d.activeDepotId];
        if (typeof v === 'string' && v) emoji = v;
      }
    }
    dcSetEmojiFavicon(emoji);
  } catch(e){ /* static icon.png stays */ }
})();
</script>
<link rel="apple-touch-icon" href="icon.png">
<script>
/* Apply the saved (or system) theme before first paint to avoid a flash */
(function(){
  try {
    var t = null;
    try { t = localStorage.getItem('depotCatalog.theme'); } catch(e){}
    if (t !== 'dark' && t !== 'light'){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>
<script>
/* Fix (settings): apply the saved font/icon scale before first paint (no flash) */
(function(){
  try {
    var MAP = { small:0.9, normal:1, large:1.15, xl:1.3 };
    var f = localStorage.getItem('depotCatalog.fontScale');
    var i = localStorage.getItem('depotCatalog.iconScale');
    if (MAP[f]) document.documentElement.style.setProperty('--app-font-scale', String(MAP[f]));
    if (MAP[i]) document.documentElement.style.setProperty('--app-icon-scale', String(MAP[i]));
  } catch(e){}
})();
</script>

(function(){

/* ================= Category dropdown (Fix: category dropdown) ================= */
/* The Category field is a <select> whose FIRST option is "Add new category" (value '').
   Choosing it opens the "new category" MODAL (Fix: new category modal — it used to be an
   inline editor). The option list is derived at render time from the ACTIVE depot's items
   (unique, case-insensitive, trimmed, non-empty; first-seen casing kept; sorted A->Z) and
   is preceded by a non-selectable "------" separator. A typed value becomes an option only
   once an item is saved with it — unsaved typing is discarded. Category stays a free-text
   string on the item; CSV import/export, the list's "-" placeholder, search matching and
   duplicate detection (name + location) are all unchanged. */

/* Unique, case-insensitive categories of the active depot (first-seen casing, A->Z). */
function categoryOptions(){
  var seen = {}, out = [];
  (state.items || []).forEach(function(it){
    if (!it || typeof it.category !== 'string') return;
    var v = it.category.trim();
    if (!v) return;
    var k = v.toLowerCase();
    if (seen[k]) return;
    seen[k] = true;
    out.push(v);
  });
  out.sort(function(a, b){
    var x = a.toLowerCase(), y = b.toLowerCase();
    return (x < y) ? -1 : (x > y ? 1 : 0);
  });
  return out;
}
/* Rebuild the options, then restore `current` as the selected value. A value that is not
   an option yet (typed but not saved) is added as a transient option so it can display. */
function fillCategorySelect(sel, current){
  if (!sel) return;
  var val = (current == null) ? '' : String(current);
  var seen = {};
  sel.innerHTML = '';
  /* Fix (category order): the non-selectable "------" divider is the FIRST entry now, ahead
     of "Add new category". Display-only - it is an <option>, so it can never reach the item
     data, the CSV export or any other output. */
  var sep = document.createElement('option');
  sep.disabled = true;
  sep.value = CAT_SEP_VALUE;
  sep.textContent = '------';
  sel.appendChild(sep);
  /* Fix (category order): "Add new category" carries a sentinel value, so picking it is
     always a real value change and `change` therefore always fires. An entry whose value
     equals the empty state can be re-picked silently (no event at all). */
  var addNew = document.createElement('option');
  addNew.value = CAT_NEW_VALUE;
  addNew.textContent = t('categoryDropdownAddNew');
  sel.appendChild(addNew);
  /* Fix (category order): the empty state still shows "Add new category", but through its
     own value (""), so the entry above stays re-selectable. display:none on an <option>
     keeps it out of the popup (Chromium/Firefox), so the visible list still reads
     "------" -> "Add new category" -> categories. */
  var rest = document.createElement('option');
  rest.value = '';
  rest.textContent = t('categoryDropdownAddNew');
  rest.disabled = true;
  rest.style.display = 'none';
  sel.appendChild(rest);
  categoryOptions().forEach(function(c){
    seen[c.toLowerCase()] = true;
    var o = document.createElement('option');
    o.value = c;
    o.textContent = c;
    sel.appendChild(o);
  });
  if (val && !seen[val.toLowerCase()]){
    var tmp = document.createElement('option');
    tmp.value = val;
    tmp.textContent = val;
    sel.appendChild(tmp);
  }
  sel.value = val;
  if (sel.selectedIndex < 0) sel.value = ''; // never leave the control blank
  sel.__catValue = sel.value;                // committed value - the modal resets to this
}
/* An existing category wins over the typed casing; otherwise the typed value is kept. */
function resolveCategoryCasing(v){
  var lv = v.toLowerCase();
  var list = categoryOptions();
  for (var i = 0; i < list.length; i++){
    if (list[i].toLowerCase() === lv) return list[i];
  }
  return v;
}
/* Refresh the Category dropdowns, keeping each one's current value selected. */
function refreshCategorySelects(){
  [el.inpCategory, el.bulkInpCategory].forEach(function(sel){
    if (!sel) return;
    fillCategorySelect(sel, sel.value);
  });
}
/* ===== Fix (new category modal): the "Add new category" flow is a modal, not inline =====
   The modal is opened from a Category <select>. Save writes the resolved value onto that
   select; Cancel and Escape leave it on "Add new category" (empty). Focus always returns
   to the select that triggered it. */
var catModalTarget = null; // the Category <select> that opened the modal
/* Fix (category order): option values for the "------" divider and for "Add new category".
   Both start with NUL, so they can never collide with a real category (categories are free
   text) - and the "Add new category" entry can never collide with the empty state. */
var CAT_NEW_VALUE = '\u0000cat-new';
var CAT_SEP_VALUE = '\u0000cat-sep';

function catModalIsOpen(){
  return !el.catOverlay.classList.contains('hidden');
}
function openCategoryModal(sel){
  if (!sel || !document.contains(sel)) return;
  catModalTarget = sel;
  /* Fix (category order): put the dropdown back on the value it had before "Add new
     category" was picked. It must not stay on that entry, otherwise picking it again would
     not change the value and would not fire `change`. */
  sel.value = (sel.__catValue == null) ? '' : sel.__catValue;
  el.catModalInput.value = '';
  setInvalid(el.catModalInput, false);
  el.catModalSave.disabled = true; // stays disabled until the input is non-empty
  el.catOverlay.classList.remove('hidden');
  announce(t('categoryInlineEnterAnnouncement'));
  try { el.catModalInput.focus(); } catch(e){}
}
/* Closes the dialog and returns focus to the dropdown that opened it. */
function closeCategoryModal(){
  el.catOverlay.classList.add('hidden');
  el.catModalInput.value = '';
  setInvalid(el.catModalInput, false);
  el.catModalSave.disabled = true;
  var back = catModalTarget;
  catModalTarget = null;
  if (back && document.contains(back)){ try { back.focus(); } catch(e){} }
}
function saveCategoryModal(){
  var sel = catModalTarget;
  if (!sel) return;
  var raw = el.catModalInput.value.trim();
  if (!raw) return; // Save is disabled in this state
  var val = resolveCategoryCasing(raw); // existing casing wins, otherwise the typed casing
  closeCategoryModal();                 // restores focus to the dropdown
  /* The value becomes the field's value. It is deliberately NOT added to the option list
     yet — it only becomes an option once an item is saved with it (fillCategorySelect
     appends a transient option so the new value can still show as selected). */
  if (document.contains(sel)) fillCategorySelect(sel, val);
  announce(t('categorySetAnnouncement', { name: val }));
}
function cancelCategoryModal(){
  var sel = catModalTarget;
  var prev = (sel && sel.__catValue != null) ? sel.__catValue : ''; // value before "Add new category"
  closeCategoryModal();                 // restores focus to the dropdown
  if (sel && document.contains(sel)) fillCategorySelect(sel, prev); // back to the previous selection
}
/* Wire a Category <select>: picking "Add new category" opens the modal. */
function setupCategorySelect(sel){
  if (!sel || sel.__catReady) return;
  sel.__catReady = true;
  fillCategorySelect(sel, sel.value);
  sel.addEventListener('change', function(){
    /* Fix (category order): detected by value, not by label. The entry carries a sentinel
       value, so this branch is always reached - picking it is always a value change. */
    if (sel.value === CAT_NEW_VALUE){
      openCategoryModal(sel); // opens the modal and reverts the dropdown to its previous value
    } else {
      sel.__catValue = sel.value; // remember the committed value for the modal reset
      setInvalid(sel, false);
    }
  });
}

/* ================= Manual backup: CSV export / import ================= */
function pad2(n){ return String(n).length < 2 ? '0' + n : String(n); }
function csvEscape(value){
  var v = String(value);
  if (/[",\r\n]/.test(v)){
    return '"' + v.replace(/"/g, '""') + '"';
  }
  return v;
}
function sanitizeFilePart(name){
  var s = String(name || '').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim();
  return s || 'Depot';
}
function handleExport(){
  var dep = activeDepot();
  if (!dep) return;
  // Warn that only the active depot is exported; the user confirms or cancels
  askConfirm({
    title: t('exportWarnTitle'),
    message: t('exportWarnMsg', { depotName: dep.name }),
    okLabel: t('download')
  }).then(function(yes){
    if (!yes) return;
    var lines = ['Name,Location,Category,Amount']; // Fix (field order): Category precedes Amount
    for (var i = 0; i < dep.items.length; i++){
      lines.push(csvEscape(dep.items[i].name) + ',' + csvEscape(dep.items[i].location) + ',' + csvEscape(dep.items[i].category) + ',' + String(dep.items[i].amount));
    }
    // BOM so spreadsheet apps detect UTF-8 correctly
    var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date(); // local time
    a.download = 'depotCatalog_' + sanitizeFilePart(dep.name) +
                 '_D' + pad2(d.getDate()) + pad2(d.getMonth() + 1) +
                 String(d.getFullYear()).slice(-2) +
                 '_T' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.csv';
    a.href = url;
    document.body.appendChild(a);
    a.click(); // direct user gesture => works on desktop and mobile
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast(t('exported'), 'success');
    announce(t('exported'));
  });
}
/* RFC-4180-style CSV parser: quoted fields, escaped quotes, CRLF/LF */
function parseCsvRows(text){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
  var rows = [], row = [], field = '', inQuotes = false;
  for (var i = 0; i < text.length; i++){
    var c = text.charAt(i);
    if (inQuotes){
      if (c === '"'){
        if (text.charAt(i + 1) === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else {
        field += c;
      }
    } else if (c === '"'){
      inQuotes = true;
    } else if (c === ','){
      row.push(field); field = '';
    } else if (c === '\n'){
      row.push(field); rows.push(row); row = []; field = '';
    } else if (c === '\r'){
      if (text.charAt(i + 1) === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else {
      field += c;
    }
  }
  if (field !== '' || row.length > 0){ row.push(field); rows.push(row); }
  return rows;
}
function analyzeCsvImport(text){
  var rows = parseCsvRows(text);
  if (rows.length === 0) return { error: true };
  /* Fix (field order): the header must be exactly Name,Location,Category,Amount — matched by
     name, case-insensitively and trimmed, IN THAT ORDER. The old order (…,Amount,Category) is
     rejected. A trailing empty column (a stray final comma) is tolerated. */
  var header = rows[0].map(function(s){ return s.trim().toLowerCase(); });
  while (header.length && header[header.length - 1] === '') header.pop();
  var wantHeader = ['name', 'location', 'category', 'amount'];
  var headerOk = (header.length === wantHeader.length);
  for (var hh = 0; headerOk && hh < wantHeader.length; hh++){
    if (header[hh] !== wantHeader[hh]) headerOk = false;
  }
  if (!headerOk) return { error: true, badHeader: true };
  var nameIdx = 0, locIdx = 1, catIdx = 2, amountIdx = 3;
  // keys of existing items: imported rows matching these are duplicates too
  var existingKeys = {};
  for (var e = 0; e < state.items.length; e++){
    existingKeys[state.items[e].name.toLowerCase() + '||' + state.items[e].location.toLowerCase()] = true;
  }
  var valid = [], dup = [], missing = [], amountDefaulted = 0, noLocation = 0;
  var seen = {};
  for (var r = 1; r < rows.length; r++){
    var cells = rows[r];
    if (cells.length === 1 && cells[0].trim() === '') continue; // blank line
    var rowNum = r + 1; // 1-based, header is row 1
    var name = (nameIdx < cells.length) ? cells[nameIdx].trim().slice(0, 200) : '';
    var location = (locIdx < cells.length) ? cells[locIdx].trim().slice(0, 200) : '';
    /* Fix (category): the Category column is optional. A missing column (or a short
       row) yields '' for every row; a present column is used as-is (empty allowed).
       Category never participates in duplicate detection (name + location only). */
    var category = (catIdx !== -1 && catIdx < cells.length) ? cells[catIdx].trim().slice(0, 200) : '';
    if (!name){
      // Fix (Phase 5): only a missing NAME skips a row now — empty location is allowed
      missing.push({ row: rowNum, name: '', location: location, reason: 'name' });
      continue;
    }
    // Fix (Phase 4): optional Amount — present+valid used as-is; empty/invalid/missing
    // column defaults to 1 and is counted for user feedback (valid rows only)
    var am = 1, amDefaulted = false;
    if (amountIdx !== -1){
      var rawA = (amountIdx < cells.length) ? cells[amountIdx].trim() : '';
      if (rawA !== ''){
        var pr = parseAmount(rawA);
        if (pr.ok){ am = pr.value; } else { amDefaulted = true; }
      } else {
        amDefaulted = true;
      }
    } else {
      amDefaulted = true;
    }
    var key = name.toLowerCase() + '||' + location.toLowerCase();
    if (seen[key] || existingKeys[key]){
      dup.push({ row: rowNum, name: name, location: location });
      continue;
    }
    seen[key] = true;
    valid.push({ name: name, location: location, amount: am, category: category }); // Fix (category)
    if (amDefaulted) amountDefaulted++;
    if (!location) noLocation++; // Fix (Phase 5): count imported rows with no location
  }
  return { valid: valid, dup: dup, missing: missing, amountDefaulted: amountDefaulted, noLocation: noLocation };
}
function skippedLine(item, reasonKey, emoji){
  var icon = emoji ? emoji + ' ' : '';
  return icon + t('skippedRow', { n: item.row }) + ': \u201C' + item.name + '\u201D @ \u201C' +
         item.location + '\u201D \u2014 ' + t(reasonKey);
}
function handleImportFile(file){
  if (!file) return;
  if (!activeDepot()) return; // nowhere to import into
  var reader = new FileReader();
  reader.onerror = function(){ showToast(t('invalidFile'), 'error'); announce(t('invalidFile'), true); };
  reader.onload = function(){
    var result = analyzeCsvImport(String(reader.result));
    if (result.error){
      /* Fix (field order): a wrong header order gets its own message. Same error path as
         before — toast + assertive live-region announcement (never a native alert). */
      var badHeaderMsg = result.badHeader ? t('csvBadHeaderOrder') : t('csvBadHeader');
      showToast(badHeaderMsg, 'error'); announce(badHeaderMsg, true); return;
    }
    var skippedCount = result.dup.length + result.missing.length;
    var listItems = [];
    result.dup.forEach(function(d){
      listItems.push(skippedLine(d, 'reasonDup'));
    });
    result.missing.forEach(function(m){
      listItems.push(skippedLine(m, m.reason === 'both' ? 'reasonNoBoth' :
                                     (m.reason === 'name' ? 'reasonNoName' : 'reasonNoLoc')));
    });
    askConfirm({
      title: t('impSumTitle'),
      message: t('impSumValid', { n: result.valid.length }) + '\n' +
               t('impSumDup', { n: result.dup.length }) + '\n' +
               t('impSumMissing', { n: result.missing.length }) +
               (result.noLocation > 0 ? '\n' + t('impSumNoLoc', { n: result.noLocation }) : '') + // Fix (Phase 5): non-blocking no-location warning
               (result.amountDefaulted > 0 ? '\n' + t('impSumAmount', { n: result.amountDefaulted }) : ''), // Fix (Phase 4): amount-defaulted summary line (no emoji in modal)
      list: listItems,
      okLabel: t('impApplyBtn'),
      danger: false
    }).then(function(yes){
      if (!yes) return;
      // APPEND: keep existing items, add the valid rows with new IDs
      var firstNewId = null;
      result.valid.forEach(function(v){
        var id = state.nextItemId++;
        if (firstNewId === null) firstNewId = id;
        state.items.push({ id: id, name: v.name, location: v.location, amount: v.amount, category: v.category }); // Fix (category): category imported
      });
      state.editingId = null;
      persist(); snapshotCurrentData();
      // Show the page that contains the first newly added item
      if (firstNewId !== null){
        var fl = getFilteredItems();
        for (var k = 0; k < fl.length; k++){
          if (fl[k].id === firstNewId){ state.page = Math.floor(k / state.pageSize) + 1; break; }
        }
      }
      hideImportReport();
      render();
      if (skippedCount > 0 || result.amountDefaulted > 0 || result.noLocation > 0){ // Fix (Phase 5): notice also for no-location rows
        // Fix (Phase 4): show the notice when rows were skipped OR when Amount was
        // defaulted (e.g., missing Amount column) — spec requires feedback in both cases
        showImportReport(result.valid.length, result.dup, result.missing, result.amountDefaulted, result.noLocation); // Fix (Phase 5): pass no-location count
        showSaveIndicator(); // Fix: data is persisted even when rows were skipped (audit #8)
        // Fix (Phase 4): SR users get the same defaulted-rows feedback as visual users
        announce(t('impComplete', { n: result.valid.length, d: result.dup.length }) +
                 (result.amountDefaulted > 0 ? ' ' + t('impSumAmount', { n: result.amountDefaulted }) : ''), true);
      } else {
        showSaveIndicator();
        showToast(t('imported', { n: result.valid.length }), 'success');
        announce(t('imported', { n: result.valid.length }));
      }
    });
  };
  reader.readAsText(file);
}
function hideImportReport(){
  el.importReport.classList.add('hidden');
}
function showImportReport(validCount, dup, missing, amountDefaulted, noLocation){
  el.impReportTitle.textContent = t('impReportTitle');
  el.impReportSummary.textContent = t('imported', { n: validCount });
  el.impReportList.innerHTML = '';
  function addItem(cls, text){
    var li = document.createElement('li');
    if (cls) li.className = cls;
    li.textContent = text; // textContent => XSS-safe
    el.impReportList.appendChild(li);
  }
  // Grouped sections with clear headers and spacing between them
  if (dup.length){
    addItem('report-header', t('impRepDupHeader', { n: dup.length }));
    dup.forEach(function(d){
      addItem('', skippedLine(d, 'reasonDup', '\u26A0\uFE0F'));
    });
  }
  if (missing.length){
    addItem('report-header', t('impRepMissingHeader', { n: missing.length }));
    missing.forEach(function(m){
      addItem('', skippedLine(m, m.reason === 'both' ? 'reasonNoBoth' :
                                     (m.reason === 'name' ? 'reasonNoName' : 'reasonNoLoc'), '\u274C'));
    });
  }
  if (amountDefaulted > 0){
    // Fix (Phase 4): mention amount-defaulted rows (emoji allowed outside modals)
    addItem('report-header', t('impRepAmountHeader', { n: amountDefaulted }));
  }
  if (noLocation > 0){
    // Fix (Phase 5): non-blocking warning for imported rows without a location
    addItem('report-header', t('impRepNoLocHeader', { n: noLocation }));
  }
  el.importReport.classList.remove('hidden');
}

var SCALE_VALUES = { small: 0.9, normal: 1, large: 1.15, xl: 1.3 };
var SIZE_KEYS = { small: 'sizeSmall', normal: 'sizeNormal', large: 'sizeLarge', xl: 'sizeExtraLarge' };
var settingsLastFocused = null;
function readScale(key){
  try { var v = localStorage.getItem(key); return SCALE_VALUES[v] ? v : 'normal'; } catch(e){ return 'normal'; }
}
function applyFontScale(v){
  var k = SCALE_VALUES[v] ? v : 'normal';
  document.documentElement.style.setProperty('--app-font-scale', String(SCALE_VALUES[k]));
}
function applyIconScale(v){
  var k = SCALE_VALUES[v] ? v : 'normal';
  document.documentElement.style.setProperty('--app-icon-scale', String(SCALE_VALUES[k]));
}
/* Refresh the settings dialog labels/options. Called from applyStaticText on every
   render, so a language switch re-localizes the dialog while it is open. */
function applySettingsText(){
  if (!el.settingsTitle) return;
  el.settingsTitle.textContent = t('settingsTitle');
  el.lblSetLang.textContent = t('languageLabel');
  el.lblSetFont.textContent = t('fontSizeLabel');
  el.lblSetIcon.textContent = t('iconSizeLabel');
  el.btnResetSettings.textContent = t('resetToDefaults');
  el.setClose.textContent = t('close');
  el.btnSettings.setAttribute('aria-label', t('settingsButton'));
  el.btnSettings.title = t('settingsButton');
  /* language options come from the loaded blocks (label = each block's own name) */
  el.setLang.innerHTML = '';
  LANGUAGES.forEach(function(Lg){
    var o = document.createElement('option');
    o.value = Lg.code;
    o.textContent = Lg.label || Lg.code;
    el.setLang.appendChild(o);
  });
  el.setLang.value = state.lang;
  ['setFont', 'setIcon'].forEach(function(id){
    var sel = el[id];
    for (var i = 0; i < sel.options.length; i++){
      sel.options[i].textContent = t(SIZE_KEYS[sel.options[i].value]);
    }
  });
  el.setFont.value = state.fontScale;
  el.setIcon.value = state.iconScale;
}
function openSettings(){
  settingsLastFocused = document.activeElement;
  applySettingsText();
  el.settingsOverlay.classList.remove('hidden');
  /* Fix (settings focus): focus the Close button, NOT the Language <select>. Auto-focusing
     a select makes mobile browsers pop the native picker the instant the dialog opens.
     Focus still moves into the dialog and the Tab trap is untouched; Shift+Tab from Close
     walks back through Reset -> Icon -> Font -> Language, so the order is unchanged. */
  try { el.setClose.focus(); } catch(e){}
}
function closeSettings(){
  el.settingsOverlay.classList.add('hidden');
  /* Fix (settings): the gear is the only opener, so focus deterministically returns there
     (mirrors the icon picker) regardless of how the dialog was opened. */
  var back = el.btnSettings || settingsLastFocused;
  if (back && back.focus){ try { back.focus(); } catch(e){} }
  settingsLastFocused = null;
}
function settingsTabTrap(ev){
  if (ev.key !== 'Tab') return;
  var f = el.settingsOverlay.querySelectorAll('button:not([disabled]):not(.hidden),select:not([disabled]):not(.hidden)');
  if (!f.length) return;
  var first = f[0], last = f[f.length - 1];
  if (ev.shiftKey){
    if (document.activeElement === first || document.activeElement === el.settingsOverlay){ ev.preventDefault(); last.focus(); }
  } else {
    if (document.activeElement === last){ ev.preventDefault(); first.focus(); }
  }
}
function onSettingsLangChange(){
  var v = el.setLang.value;

function selectDepot(id){
  if (id === state.activeDepotId){ closeDepotMenu(); el.inpSearch.focus(); return; }
  state.activeDepotId = id;
  syncItemsRef();
  var dep = activeDepot(); // Fix: dep was undeclared => ReferenceError under 'use strict'; depot-switch announce crashed (audit #1)
  // Reset UI to the initial app state (fresh page load feel, preferences kept)
  state.filter = '';
  state.sort = { key: null, dir: null }; // Fix (sortable columns): sort resets to Default on depot switch
  state.selectedIds = {}; // Fix (batch select): depot switch clears selection
  state.page = 1;
  state.pageSize = 5;
  el.selPageSize.value = '5';
  state.editingId = null;
  el.inpSearch.value = '';

  el.formCard.classList.add('hidden');            // close Add/Import section
  el.btnToggleAdd.classList.remove('invisible'); // restore the toggle button
  hideImportReport();                             // dismiss import notice
  if (!el.overlay.classList.contains('hidden')) closeConfirm(false); // close any modal
  closeDepotMenu();
  persist(); snapshotCurrentData();
  showSaveIndicator();
  render();

  el.inpSearch.focus();

function openAddDepotModal(){
  askInput({ title: t('addDepotTitle') }).then(function(name){
    if (name === null) return;                 // cancelled
    if (!name){ setInvalid(el.modalInput, true); showToast(t('depotNameReq'), 'error'); announce(t('depotNameReq'), true); return; } // Fix (a11y audit C1)
    var id = state.nextDepotId++;
    state.depots.push({ id: id, name: name, items: [] });
    state.activeDepotId = id;
    syncItemsRef();
    state.filter = '';
    state.sort = { key: null, dir: null }; // Fix (sortable columns): active depot changed — reset sort
    state.selectedIds = {}; // Fix (batch select): depot changed — clear selection
    state.page = 1;
    state.editingId = null;
    hideImportReport();
    persist(); snapshotCurrentData();
    render();
    applyFavicon(); // Fix (favicon on load): new depot became active (may reset the icon to 📦)

function openDeleteDepot(id){
  var dep = findDepot(id);
  if (!dep) return;
  askConfirm({
    title: t('deleteDepotTitle'),
    message: t('deleteDepotConfirm', { name: dep.name }),
    okLabel: t('del'),
    danger: true
  }).then(function(yes){
    if (!yes) return;
    state.depots = state.depots.filter(function(d){ return d.id !== id; });
    if (state.depots.length === 0){
      // Fallback: automatically recreate a default depot named "Depot-1"
      state.depots = [{ id: state.nextDepotId++, name: t('defaultDepotName'), items: [] }];
      state.activeDepotId = state.depots[0].id;
    } else if (state.activeDepotId === id){
      state.activeDepotId = state.depots[0].id;
    }
    syncItemsRef();
    state.filter = '';
    state.sort = { key: null, dir: null }; // Fix (sortable columns): active depot may have changed — reset sort
    state.selectedIds = {}; // Fix (batch select): depot may have changed — clear selection
    state.page = 1;
    state.editingId = null;
    el.inpSearch.value = '';
    el.btnClearSearch.classList.add('hidden');
    hideImportReport();
    delete state.depotIcons[id]; // Fix (depot icon picker): drop the icon with its depot
    persist(); snapshotCurrentData();
    render();

    showSaveIndicator();
    showToast(t('depotDeleted'), 'success');
    announce(t('depotDeleted'));

/* ================= Depot icon picker (Fix: depot icon picker) ================= */
/* Icons live in state.depotIcons (id -> emoji); a depot with no entry uses the 📦
   fallback. Selecting 📦 REMOVES the entry (keeps the map clean — documented choice).
   Keys are unaffected by switches; deleting a depot drops its entry, and the favicon
   is regenerated from the active depot's emoji (canvas -> data URL). */
var DEPOT_EMOJIS = ['📦','📚','💊','🧰','🔧','👕','🧸','🎨','📎','💻','📱','🎮','🍎','🍳','🧴','🪴','🪑','🚗','🏷️','📁'];
var ICON_NAME_KEYS = {
  '📦':'icoPkg','📚':'icoBooks','💊':'icoMedicine','🧰':'icoToolbox','🔧':'icoTools',
  '👕':'icoClothing','🧸':'icoToys','🎨':'icoArt','📎':'icoOffice','💻':'icoElectronics',
  '📱':'icoPhones','🎮':'icoGaming','🍎':'icoFood','🍳':'icoKitchen','🧴':'icoToiletries',
  '🪴':'icoPlants','🪑':'icoFurniture','🚗':'icoAuto','🏷️':'icoMisc','📁':'icoDocuments'
};
var DEFAULT_DEPOT_ICON = '📦';
var iconPickerReturnFocus = null;
var iconPickerPending = null; // Fix (icon picker save/cancel): pending selection, committed by Save only
function depotIconOf(id){
  return (id != null && state.depotIcons && state.depotIcons[id]) ? state.depotIcons[id] : DEFAULT_DEPOT_ICON;
}
function iconName(emoji){
  var key = ICON_NAME_KEYS[emoji];
  return key ? t(key) : emoji;
}
function syncDepotIconUI(){
  if (el.depotIconEmoji) el.depotIconEmoji.textContent = depotIconOf(state.activeDepotId);
  if (el.btnDepotIcon){
    var iconLbl = t('iconButtonLabel');
    el.btnDepotIcon.setAttribute('aria-label', iconLbl);
    el.btnDepotIcon.title = iconLbl; // Fix (a11y audit I3): tooltip mirrors the accessible name
  }
}
function renderIconGrid(){
  /* Applied icon keeps the subtle .applied outline; the PENDING choice gets the
     strong .selected highlight. Both can be the same tile when pending === applied. */
  el.iconGrid.innerHTML = '';
  var applied = depotIconOf(state.activeDepotId);
  var pending = iconPickerPending;
  DEPOT_EMOJIS.forEach(function(em, idx){
    var b = document.createElement('button');
    b.type = 'button';
    var isSel = (em === pending);
    b.className = 'icon-pick' + (em === applied ? ' applied' : '') + (isSel ? ' selected' : '');
    /* Fix (a11y audit N1): decorative emoji wrapped in an aria-hidden span */
    var ico = document.createElement('span');
    ico.setAttribute('aria-hidden', 'true');
    ico.textContent = em;
    b.appendChild(ico);
    b.setAttribute('data-idx', String(idx));
    var nm = iconName(em);
    var lbl = nm + (em === applied ? t('iconCurrentSuffix') : '') + (isSel ? t('iconSelectedSuffix') : '');
    b.setAttribute('aria-label', lbl);
    b.title = lbl; // Fix (a11y audit N2): tooltip mirrors the accessible name
    b.setAttribute('aria-pressed', isSel ? 'true' : 'false'); // pending state for screen readers
    if (em === applied) b.setAttribute('aria-current', 'true'); // applied state
    b.addEventListener('click', function(){ selectPendingIcon(em); });
    el.iconGrid.appendChild(b);
  });
}
function selectPendingIcon(emoji){
  /* Fix (icon picker save/cancel): clicking a tile only marks it as pending —
     the modal stays open so the user can compare options before Save. */
  iconPickerPending = emoji;
  // Update tiles IN PLACE so keyboard focus stays on the clicked button
  var tiles = el.iconGrid.querySelectorAll('.icon-pick');
  var applied = depotIconOf(state.activeDepotId);
  for (var i = 0; i < tiles.length; i++){
    var em = tiles[i].textContent;
    var isSel = (em === emoji);
    tiles[i].classList.toggle('selected', isSel);
    tiles[i].setAttribute('aria-pressed', isSel ? 'true' : 'false');
    var nm = iconName(em);
    var lbl = nm + (em === applied ? t('iconCurrentSuffix') : '') + (isSel ? t('iconSelectedSuffix') : '');
    tiles[i].setAttribute('aria-label', lbl);
    tiles[i].title = lbl; // Fix (a11y audit N2): keep the tooltip in sync
  }
  announce(t('iconSelectedAnnouncement', { emojiName: iconName(emoji) })); // polite
}
function savePendingIcon(){
  var emoji = (iconPickerPending != null) ? iconPickerPending : depotIconOf(state.activeDepotId);
  var id = state.activeDepotId;
  if (id == null){ closeIconPicker(); return; }
  /* Save is ALWAYS enabled (documented choice): when pending === applied it simply
     closes without writing — no redundant snapshot or "changed" announcement. */
  if (emoji !== depotIconOf(id)){
    if (emoji === DEFAULT_DEPOT_ICON){
      delete state.depotIcons[id]; // 📦 removes the entry (fallback applies)
    } else {
      state.depotIcons[id] = emoji;
    }
    persist();
    snapshotCurrentData(); // auto-backup snapshot
    syncDepotIconUI();     // title icon button updates
    applyFavicon();        // dynamic favicon updates
    showSaveIndicator();
    announce(t('iconChanged', { emojiName: iconName(emoji) }));
  }
  closeIconPicker();
}
function openIconPicker(){
  el.iconPickerTitle.textContent = t('iconPickerTitle');
  el.iconPickerSave.textContent = t('iconPickerSave');
  el.iconPickerCancel.textContent = t('iconPickerCancel');
  el.iconGrid.setAttribute('aria-label', t('iconPickerTitle'));
  iconPickerPending = depotIconOf(state.activeDepotId); // pending starts equal to the applied icon
  renderIconGrid();
  iconPickerReturnFocus = document.activeElement;
  el.iconPickerOverlay.classList.remove('hidden');
  var target = el.iconGrid.querySelector('.icon-pick.selected') || el.iconGrid.querySelector('.icon-pick');
  if (target){ try { target.focus(); } catch(e){} } // a11y: focus the pending emoji (or the first)
}
function closeIconPicker(){
  el.iconPickerOverlay.classList.add('hidden');
  iconPickerPending = null; // Fix (icon picker save/cancel): Cancel/Escape discard the pending choice
  /* Fix: the picker is always opened from the icon button, so focus returns there
     deterministically (spec §6); the captured element is only a fallback. */
  var back = el.btnDepotIcon || iconPickerReturnFocus;
  iconPickerReturnFocus = null;
  if (back && back.focus){ try { back.focus(); } catch(e){} }
}
function chooseDepotIcon(emoji){
  /* Superseded by selectPendingIcon + savePendingIcon (Fix: icon picker save/cancel);
     kept as a thin apply helper so the two-phase flow stays the only entry point. */
  iconPickerPending = emoji;
  savePendingIcon();
}
function iconPickerKeydown(ev){
  if (ev.key === 'Tab'){
    // Focus trap: Tab cycles through the 20 emoji buttons and Close, in DOM order
    var f = el.iconPickerOverlay.querySelectorAll('button:not([disabled]):not(.hidden)');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (ev.shiftKey){
      if (document.activeElement === first || document.activeElement === el.iconPickerOverlay){
        ev.preventDefault(); last.focus();
      }
    } else if (document.activeElement === last){
      ev.preventDefault(); first.focus();
    }
    return;
  }
  // Optional enhancement: arrow keys move between the 4-column grid cells
  var cols = 4, k = ev.key;
  if (k !== 'ArrowLeft' && k !== 'ArrowRight' && k !== 'ArrowUp' && k !== 'ArrowDown') return;
  var ae = document.activeElement;
  var idx = parseInt((ae && ae.getAttribute) ? (ae.getAttribute('data-idx') || '-1') : '-1', 10);
  if (idx < 0) return;
  var next = idx;
  if (k === 'ArrowLeft') next = idx - 1;
  else if (k === 'ArrowRight') next = idx + 1;
  else if (k === 'ArrowUp') next = idx - cols;
  else next = idx + cols;
  if (next < 0 || next >= DEPOT_EMOJIS.length) return;
  ev.preventDefault();
  var btns = el.iconGrid.querySelectorAll('.icon-pick');
  if (btns[next]) btns[next].focus();
}

function countSelection(){
  return Object.keys(state.selectedIds).length;
}
/* Prune the selection to the visible page and sync the select-all checkbox +
   Delete-selected button. Runs at the top of renderList, so search, sort,
   pagination, depot switches and page jumps all keep the selection consistent. */
function syncBatchUI(){
  var vis = visiblePageItems();
  var visIds = {};
  for (var i = 0; i < vis.length; i++) visIds[vis[i].id] = true;
  Object.keys(state.selectedIds).forEach(function(id){
    if (!visIds[id]) delete state.selectedIds[id];
  });
  updateSelectAllState(vis);
  updateDeleteSelectedBtn();
}
function updateSelectAllState(vis){
  if (!el.selectAll) return;
  if (!vis) vis = visiblePageItems();
  var selCount = 0;
  for (var i = 0; i < vis.length; i++){ if (state.selectedIds[vis[i].id]) selCount++; }
  el.selectAll.disabled = (vis.length === 0);
  el.selectAll.checked = (vis.length > 0 && selCount === vis.length);
  el.selectAll.indeterminate = (selCount > 0 && selCount < vis.length); // mixed state, exposed to AT via the IDL property
}
function updateDeleteSelectedBtn(){
  /* Fix (bulk edit) + Fix (bulk icons): both batch buttons show the inline
     row-action icon (✏️/🗑️, aria-hidden) plus the live count "(N)" — no words.
     The accessible name is a descriptive aria-label that doubles as the title
     tooltip and updates with the count (also refreshed on language switch via
     render → syncBatchUI). Both are display:none at count 0, so neither is
     tab-reachable — the hidden-state requirement needs no extra code. */
  var n = countSelection();
  if (n > 0){
    el.delSelCount.textContent = String(n);
    el.editSelCount.textContent = String(n);
    var delLbl = t('bulkDeleteSelected', { count: n });
    var editLbl = t('bulkEditSelected', { count: n });
    el.btnDelSelected.setAttribute('aria-label', delLbl);
    el.btnDelSelected.title = delLbl;
    el.btnEditSelected.setAttribute('aria-label', editLbl);
    el.btnEditSelected.title = editLbl;
    el.btnDelSelected.classList.remove('hidden');
    el.btnEditSelected.classList.remove('hidden');
  } else {
    el.btnDelSelected.classList.add('hidden');
    el.btnEditSelected.classList.add('hidden');
  }
}
function toggleSelect(id){
  if (state.selectedIds[id]) delete state.selectedIds[id];
  else state.selectedIds[id] = true;
  updateSelectAllState();
  updateDeleteSelectedBtn();
  var n = countSelection();
  announce(n > 0 ? t('nSelected', { n: n }) : t('selectionCleared'));
}
function toggleSelectAll(){
  var vis = visiblePageItems();
  var allSelected = (vis.length > 0);
  for (var i = 0; i < vis.length; i++){ if (!state.selectedIds[vis[i].id]){ allSelected = false; break; } }
  for (var j = 0; j < vis.length; j++){
    if (allSelected) delete state.selectedIds[vis[j].id];
    else state.selectedIds[vis[j].id] = true;
  }
  // update the visible row checkboxes without a full re-render
  var boxes = el.listBody.querySelectorAll('.row-check');
  for (var k = 0; k < boxes.length; k++){
    boxes[k].checked = !!state.selectedIds[boxes[k].getAttribute('data-id')];
  }
  updateSelectAllState(vis);
  updateDeleteSelectedBtn();
  var n = countSelection();
  announce(n > 0 ? t('nSelected', { n: n }) : t('selectionCleared'));
}
function handleDeleteSelected(){
  var n = countSelection();
  if (n === 0) return;
  askConfirm({
    title: t('delSelectedTitle'),
    message: t('delSelectedMsg', { n: n }),
    okLabel: t('del'),
    danger: true
  }).then(function(yes){
    if (!yes) return;
    var dep = activeDepot();
    if (!dep) return;
    var sel = state.selectedIds;
    dep.items = dep.items.filter(function(it){ return !sel[it.id]; });
    syncItemsRef();
    state.selectedIds = {};
    persist(); snapshotCurrentData(); // auto-backup snapshot
    render();                          // renderList self-heals the page number
    showSaveIndicator();
    showToast(t('nDeleted', { n: n }), 'success');
    announce(t('nDeleted', { n: n }));
    // a11y: the trigger button hides once the selection is gone — move focus to search
    if (el.btnDelSelected.classList.contains('hidden')){ try { el.inpSearch.focus(); } catch(e){} }
  });
}

/* ================= Bulk edit (Fix: bulk edit) ================= */
/* Three steps: 1) choose fields  2) preview + merge confirmation  3) final report.
   Editing-row policy: a row in inline-edit mode cannot be selected (its checkbox is
   disabled in buildEditRow and startEdit() drops it from the selection), so the bulk
   scope is simply "currently selected ids". The guard in handleEditSelected is
   defensive only — both batch buttons always operate on non-editing rows. */
var bulkPlan = null; // { ids, changes, warnLoc, warnCat, amountDefaultedCount, preview, merges }

function bulkIsOpen(){
  return !el.bulkOverlay1.classList.contains('hidden') ||
         !el.bulkOverlay2.classList.contains('hidden') ||
         !el.bulkOverlay3.classList.contains('hidden');
}
function bulkToggleInputs(){
  // Unchecked => input disabled (grayed out) and out of the tab order
  el.bulkInpName.disabled = !el.bulkChkName.checked;
  el.bulkInpLoc.disabled = !el.bulkChkLoc.checked;
  el.bulkInpAmount.disabled = !el.bulkChkAmount.checked;
  el.bulkInpCategory.disabled = !el.bulkChkCategory.checked; // Fix (category)
}
function bulkResetFields(){
  el.bulkChkName.checked = false;
  el.bulkChkLoc.checked = false;
  el.bulkChkAmount.checked = false;
  el.bulkChkCategory.checked = false; // Fix (category)
  el.bulkInpName.value = '';
  el.bulkInpLoc.value = '';
  el.bulkInpAmount.value = ''; // Amount empty => defaults to 1 at apply (no pre-fill)
  fillCategorySelect(el.bulkInpCategory, ''); // Fix (category dropdown): "Add new category" => clears the category for selected items
  el.bulkErr1.textContent = '';
  el.bulkWarnLoc.classList.add('hidden');
  el.bulkWarnCat.classList.add('hidden'); // Fix (category)
  /* Fix (a11y audit C1): a freshly opened dialog has no invalid fields */
  setInvalid(el.bulkInpName, false);
  setInvalid(el.bulkInpLoc, false);
  setInvalid(el.bulkInpAmount, false);
  setInvalid(el.bulkInpCategory, false);
  bulkToggleInputs();
}
function bulkFocusAfterClose(){
  // Trigger hides only once the selection is gone (after apply) => focus search
  if (el.btnEditSelected.classList.contains('hidden')){
    try { el.inpSearch.focus(); } catch(e){}
  } else {
    try { el.btnEditSelected.focus(); } catch(e){} // a11y: focus back to the trigger
  }
}
function handleEditSelected(){
  var dep = activeDepot();
  if (!dep) return;
  var ids = Object.keys(state.selectedIds)
    .map(function(k){ return parseInt(k, 10); })
    .filter(function(id){
      var it = findById(id); // guard: skip vanished rows and the inline-editing row
      return !!it && state.editingId !== id;
    });
  if (ids.length === 0) return;
  bulkPlan = { ids: ids, warnLoc: false, amountDefaultedCount: 0 };
  bulkResetFields();
  el.bulkTitle1.textContent = t('bulkEditTitle');
  el.bulkHint1.textContent = t('bulkScope', { n: ids.length });
  el.bulkCancel1.textContent = t('cancel');
  el.bulkContinue.textContent = t('bulkContinue');
  el.bulkOverlay1.classList.remove('hidden');
  el.bulkChkName.focus(); // first focusable element (field 1 checkbox)
}
function closeBulk1(){
  el.bulkOverlay1.classList.add('hidden');
  bulkPlan = null;
  bulkFocusAfterClose();
}
function handleBulkContinue(){
  var anyChecked = el.bulkChkName.checked || el.bulkChkLoc.checked || el.bulkChkAmount.checked ||
                   el.bulkChkCategory.checked; // Fix (category)
  el.bulkErr1.textContent = '';
  el.bulkWarnLoc.classList.add('hidden');
  el.bulkWarnCat.classList.add('hidden'); // Fix (category)
  setInvalid(el.bulkInpName, false);   // Fix (a11y audit C1): re-validate from a clean state
  setInvalid(el.bulkInpAmount, false);
  if (!anyChecked){
    el.bulkErr1.textContent = t('bulkErrNoField'); // role=alert announces it
    el.bulkChkName.focus();
    return;
  }
  var changes = { name: false, location: false, amount: false, category: false }; // Fix (category)
  var warnLoc = false, amountDefaulted = 0, warnCat = false; // Fix (category)
  if (el.bulkChkName.checked){
    var nm = el.bulkInpName.value.trim();
    if (!nm){
      el.bulkErr1.textContent = t('bulkErrName');
      setInvalid(el.bulkInpName, true); // Fix (a11y audit C1)
      el.bulkInpName.focus();
      return;
    }
    changes.name = nm;
    setInvalid(el.bulkInpName, false); // Fix (a11y audit C1)
  }
  if (el.bulkChkLoc.checked){
    changes.location = el.bulkInpLoc.value.trim();
    if (changes.location === ''){ // empty location is a valid state — warn but allow
      warnLoc = true;
      el.bulkWarnLoc.textContent = t('bulkWarnLocClear');
      el.bulkWarnLoc.classList.remove('hidden');
    }
  }
  if (el.bulkChkAmount.checked){
    if (String(el.bulkInpAmount.value).trim() === ''){
      changes.amount = 1; // empty Amount => default 1
      amountDefaulted = bulkPlan.ids.length;
    } else {
      var a = parseAmount(el.bulkInpAmount.value); // shared digits-only validation
      if (!a.ok || a.value < 0){
        el.bulkErr1.textContent = t('amountInvalid');
        setInvalid(el.bulkInpAmount, true); // Fix (a11y audit C1)
        el.bulkInpAmount.focus();
        return;
      }
      changes.amount = a.value;
      setInvalid(el.bulkInpAmount, false); // Fix (a11y audit C1)
    }
  }
  if (el.bulkChkCategory.checked){ // Fix (category): free text — empty means "clear it"
    changes.category = el.bulkInpCategory.value.trim();
    if (changes.category === ''){ // empty category is a valid state — warn but allow (mirrors Location)
      warnCat = true;
      el.bulkWarnCat.textContent = t('bulkWarnCatClear');
      el.bulkWarnCat.classList.remove('hidden');
    }
  }
  bulkPlan.changes = changes;
  bulkPlan.warnLoc = warnLoc;
  bulkPlan.warnCat = warnCat; // Fix (category)
  bulkPlan.amountDefaultedCount = amountDefaulted;
  bulkPlan.preview = bulkBuildPlan(bulkPlan.ids, changes);
  openBulkPreview();
}

function bulkNormalize(v){ return String(v || '').trim().toLowerCase(); }
function bulkBuildPlan(ids, changes){
  /* Per-item change lines for step 2. Format follows the spec:
     "Name (old) at Location (old) → Name (new) at Location (new)" — full item
     labels on both sides whenever name or location changes; Amount-only changes
     use the compact "(Amount: a → b)" form. */
  var lines = [];
  var catChangedN = 0; // Fix (category): items whose category actually changes
  ids.forEach(function(id){
    var it = findById(id);
    if (!it) return;
    var newName = (changes.name !== false) ? changes.name : it.name;
    var newLoc = (changes.location !== false) ? changes.location : it.location;
    var newAmt = (changes.amount !== false) ? changes.amount : it.amount;
    var nameChanged = newName !== it.name;
    var locChanged = newLoc !== it.location;
    var amtChanged = newAmt !== it.amount;
    var newCat = (changes.category !== false) ? changes.category : it.category; // Fix (category)
    var catChanged = newCat !== it.category; // Fix (category)
    if (catChanged) catChangedN++; // Fix (category)
    if (nameChanged || locChanged){
      lines.push(t('bulkItemAt', { name: it.name, location: it.location || '-' }) +
                 ' \u2192 ' + t('bulkItemAt', { name: newName, location: newLoc || '-' }));
    } else if (amtChanged){
      lines.push(t('bulkAmtChange', { name: it.name, location: it.location || '-', a: it.amount, b: newAmt }));
    }
    if (catChanged){ // Fix (category): "-" when the category is being cleared
      lines.push(t('bulkCatChange', { name: it.name, location: it.location || '-', c: newCat || '-' }));
    }
    // no line when nothing changes for this item
  });
  return { lines: lines, catChangedCount: catChangedN };
}
function bulkComputeMerges(ids, changes){
  /* Simulate the post-edit depot (edited + untouched items) and group by
     normalized name+location. Returns one entry per duplicate group:
     { total, members:[{name,location,amount}], removedN } (kept id = lowest). */
  var dep = activeDepot();
  if (!dep) return [];
  var sim = dep.items.map(function(it){
    var selected = (ids.indexOf(it.id) !== -1);
    return {
      id: it.id,
      name: (selected && changes.name !== false) ? changes.name : it.name,
      location: (selected && changes.location !== false) ? changes.location : it.location,
      amount: (selected && changes.amount !== false) ? changes.amount : it.amount
    };
  });
  var groups = {};
  sim.forEach(function(it){
    var key = bulkNormalize(it.name) + '\u0000' + bulkNormalize(it.location);
    if (!groups[key]) groups[key] = [];
    groups[key].push(it);
  });
  var merges = [];
  Object.keys(groups).forEach(function(key){
    var g = groups[key];
    if (g.length < 2) return;
    g.sort(function(a, b){ return a.id - b.id; }); // lowest id kept (deterministic)
    var total = 0;
    g.forEach(function(m){ total += m.amount; });
    merges.push({
      total: total,
      members: g.map(function(m){ return { name: m.name, location: m.location, amount: m.amount }; }),
      removedN: g.length - 1
    });
  });
  return merges;
}
function openBulkPreview(){
  var plan = bulkPlan.preview;
  el.bulkTitle2.textContent = t('bulkConfirmTitle');
  el.bulkP2.textContent = t('bulkPreviewList');
  el.bulkChangesList.innerHTML = '';
  plan.lines.forEach(function(line){
    var li = document.createElement('li');
    li.textContent = line; // textContent => XSS-safe
    el.bulkChangesList.appendChild(li);
  });
  el.bulkChangesList.classList.toggle('hidden', plan.lines.length === 0);
  // Merge preview — computed and shown BEFORE anything is applied
  var merges = bulkComputeMerges(bulkPlan.ids, bulkPlan.changes);
  bulkPlan.merges = merges;
  el.bulkMergeList.innerHTML = '';
  if (merges.length){
    var totalMembers = 0;
    el.bulkP3.textContent = t('bulkMergeIntro');
    el.bulkP3.classList.remove('hidden');
    merges.forEach(function(m){
      totalMembers += m.members.length;
      var amounts = m.members.map(function(x){ return x.amount; }).join(' + ');
      var li = document.createElement('li');
      li.textContent = t('bulkMergeGroupLine', {
        name: m.members[0].name, location: m.members[0].location || '-',
        n: m.members.length, amounts: amounts, total: m.total
      });
      el.bulkMergeList.appendChild(li);
    });
    var li2 = document.createElement('li');
    li2.textContent = t('bulkMergeCount', { n: totalMembers, m: merges.length });
    el.bulkMergeList.appendChild(li2);
  } else {
    el.bulkP3.classList.add('hidden');
  }
  el.bulkErr2.textContent = '';
  el.bulkCancel2.textContent = t('cancel');
  el.bulkApply.textContent = t('bulkApplyBtn');
  el.bulkOverlay1.classList.add('hidden');
  el.bulkOverlay2.classList.remove('hidden');
  el.bulkCancel2.focus(); // a11y: focus moves to the first focusable element of step 2
}
function closeBulk2(){
  // Spec choice: cancel in step 2 closes BOTH modals (simpler than going back)
  el.bulkOverlay2.classList.add('hidden');
  bulkPlan = null;
  bulkFocusAfterClose();
}

function mergeDuplicates(){
  /* Scan the WHOLE active depot (edited + untouched items) after the field changes
     and merge every group sharing a normalized name+location: lowest id is kept,
     amounts are summed, the rest are removed. Returns { mergedN, removedN, results }. */
  var dep = activeDepot();
  if (!dep) return { mergedN: 0, removedN: 0, results: [] };
  var groups = {};
  dep.items.forEach(function(it){
    var key = bulkNormalize(it.name) + '\u0000' + bulkNormalize(it.location);
    if (!groups[key]) groups[key] = [];
    groups[key].push(it);
  });
  var removeIds = {}, mergedN = 0, removedN = 0, results = [];
  Object.keys(groups).forEach(function(key){
    var g = groups[key];
    if (g.length < 2) return;
    g.sort(function(a, b){ return a.id - b.id; }); // lowest id kept (deterministic)
    var total = 0;
    g.forEach(function(m){ total += m.amount; });
    g[0].amount = total; // mutate the keeper object directly — it stays in dep.items
    for (var j = 1; j < g.length; j++) removeIds[g[j].id] = true;
    removedN += g.length - 1;
    mergedN += g.length;
    results.push({ name: g[0].name, location: g[0].location, total: total });
  });
  if (removedN === 0) return { mergedN: 0, removedN: 0, results: [] };
  dep.items = dep.items.filter(function(it){ return !removeIds[it.id]; });
  return { mergedN: mergedN, removedN: removedN, results: results };
}
function handleBulkApply(){
  var plan = bulkPlan;
  var dep = activeDepot();
  if (!plan || !dep){ closeBulk2(); return; }
  var ids = plan.ids, changes = plan.changes;
  var catChangedN = 0; // Fix (category): items that actually received a different category
  // 1) apply the confirmed field changes
  dep.items.forEach(function(it){
    if (ids.indexOf(it.id) === -1) return;
    if (changes.name !== false) it.name = changes.name;
    if (changes.location !== false) it.location = changes.location;
    if (changes.amount !== false) it.amount = changes.amount;
    if (changes.category !== false){ // Fix (category)
      if (it.category !== changes.category) catChangedN++;
      it.category = changes.category;
    }
  });
  // 2) merge duplicates created by the edit (whole-depot scan, mirrors the preview)
  var mergeRes = mergeDuplicates();
  // nextItemId: removed ids are never reused — only guarantee it stays above the max id
  if (mergeRes.removedN > 0){
    var maxId = dep.items.reduce(function(mx, it){ return Math.max(mx, it.id); }, 0);
    if (state.nextItemId <= maxId) state.nextItemId = maxId + 1;
  }
  if (state.editingId !== null && !findById(state.editingId)) state.editingId = null; // merged away
  syncItemsRef();
  state.selectedIds = {}; // selection cleared after apply
  state.page = 1;          // pagination reset to page 1
  bulkPlan = null;
  persist();
  snapshotCurrentData();   // auto-backup snapshot
  render();                // renderList self-heals the page number
  showSaveIndicator();
  var updatedN = ids.length;
  // polite announcement; merged part skipped when nothing was merged
  announce(mergeRes.removedN > 0
    ? t('bulkAnnounce', { n: updatedN, m: mergeRes.removedN })
    : t('bulkResultUpdated', { n: updatedN }));
  // 3) final report modal
  el.bulkOverlay2.classList.add('hidden');
  el.bulkTitle3.textContent = t('bulkResultTitle');
  el.bulkP4.textContent = t('bulkResultUpdated', { n: updatedN });
  el.bulkReportList.innerHTML = '';
  if (mergeRes.removedN > 0){
    var li = document.createElement('li');
    li.textContent = t('bulkResultMerged', { m: mergeRes.mergedN, k: mergeRes.mergedN - mergeRes.removedN });
    el.bulkReportList.appendChild(li);
    mergeRes.results.forEach(function(r){
      var li2 = document.createElement('li');
      li2.textContent = t('bulkItemAt', { name: r.name, location: r.location || '-' }) + ': ' + r.total;
      el.bulkReportList.appendChild(li2);
    });
    el.bulkReportList.classList.remove('hidden');
  } else {
    el.bulkReportList.classList.add('hidden');
  }
  if (plan.amountDefaultedCount > 0){
    var li3 = document.createElement('li');
    li3.textContent = t('bulkResultAmountNote', { x: plan.amountDefaultedCount });
    el.bulkReportList.appendChild(li3);
    el.bulkReportList.classList.remove('hidden');
  }
  if (catChangedN > 0){ // Fix (category): summarize the applied category changes
    var liCat = document.createElement('li');
    liCat.textContent = t('bulkResultCatNote', { n: catChangedN });
    el.bulkReportList.appendChild(liCat);
    el.bulkReportList.classList.remove('hidden');
  }
  el.bulkClose3.textContent = t('close');
  el.bulkOverlay3.classList.remove('hidden');
  el.bulkClose3.focus(); // a11y: focus moves to the Close button
}
function closeBulk3(){
  el.bulkOverlay3.classList.add('hidden');
  bulkPlan = null; // closing the report does NOT restore the selection (already cleared)
  bulkFocusAfterClose();
}
function bulkTabTrap(ev){
  // Focus trap: Tab cycles within the visible bulk overlay (mirrors #overlay, audit #3)
  var overlay = !el.bulkOverlay1.classList.contains('hidden') ? el.bulkOverlay1 :
                (!el.bulkOverlay2.classList.contains('hidden') ? el.bulkOverlay2 :
                (!el.bulkOverlay3.classList.contains('hidden') ? el.bulkOverlay3 : null));
  if (!overlay) return;
  if (ev.key !== 'Tab') return;
  var focusables = overlay.querySelectorAll('button:not([disabled]):not(.hidden),input:not([disabled]):not(.hidden)');
  if (!focusables.length) return;
  var first = focusables[0], last = focusables[focusables.length - 1];
  if (ev.shiftKey){
    if (document.activeElement === first || document.activeElement === overlay){
      ev.preventDefault(); last.focus();
    }
  } else {
    if (document.activeElement === last){
      ev.preventDefault(); first.focus();
    }
  }
}

/* ================= Event wiring & init ================= */
function bindEvents(){
  el.productForm.addEventListener('submit', handleFormSubmit);
  el.btnToggleAdd.addEventListener('click', function(){
    el.formCard.classList.remove('hidden');
    el.btnToggleAdd.classList.add('invisible'); // hide but keep space => no layout shift
    el.btnToggleAdd.setAttribute('aria-expanded', 'true'); // a11y: reflect open state
    resetForm();
    el.inpName.focus();
  });
  el.btnCloseForm.addEventListener('click', function(){
    el.formCard.classList.add('hidden');
    el.btnToggleAdd.classList.remove('invisible');
    el.btnToggleAdd.setAttribute('aria-expanded', 'false'); // a11y: reflect closed state
    resetForm();
    el.btnToggleAdd.focus();
  });
  el.selPageSize.addEventListener('change', function(){
    var n = parseInt(el.selPageSize.value, 10);
    if (isNaN(n) || n < 1) return;
    state.pageSize = n;
    state.page = 1;       // page size changed => back to first page
    state.editingId = null; // editing row may not exist on the new page
    renderList();
    announce(t('itemsPerPageChanged', { n: n }));
  });
  el.inpName.addEventListener('input', handleNameInput);
  el.inpAmount.addEventListener('input', function(){ setInvalid(el.inpAmount, false); }); // Fix (a11y audit C1): typing clears
  el.inpName.addEventListener('blur', function(){ setTimeout(hideSuggestions, 120); });
  el.inpName.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.isComposing){
      // Enter in the name field navigates to Location instead of submitting
      ev.preventDefault();
      hideSuggestions();
      el.inpLoc.focus();
      return;
    }
    if (ev.key === 'Escape') hideSuggestions();
  });
  el.inpLoc.addEventListener('input', handleLocationInput);
  /* Fix (category dropdown): Category is a <select> now — the old free-text auto-capitalize
     listener is gone (a select's .value is an option value, never a typed string). The
     first-letter rule now lives on the "new category" modal input instead. */
  setupCategorySelect(el.inpCategory);
  /* Fix (field order): keyboard flow is now Name -> Location -> Category -> Amount -> submit
     (audit #10 hardening carried forward: Enter never submits before the last field). */
  el.inpLoc.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.isComposing){
      ev.preventDefault();
      el.inpCategory.focus(); // Location -> Category
    }
  });
  el.inpCategory.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.isComposing){
      ev.preventDefault();
      if (catModalIsOpen()) return; // the "new category" modal owns Enter while it is open
      el.inpAmount.focus(); // Category -> Amount
    }
  });
  el.inpAmount.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.isComposing){
      ev.preventDefault();
      el.btnSubmit.click(); // Amount is last -> Enter submits the form
    }
  });
  document.addEventListener('compositionstart', function(){ DC.input.composing = true; });
  document.addEventListener('compositionend', function(){ DC.input.composing = false; });
  el.inpSearch.addEventListener('input', function(){
    state.filter = el.inpSearch.value;
    state.page = 1;         // filter changed => back to first page
    state.editingId = null; // editing row may be filtered out
    if (countSelection() > 0){ state.selectedIds = {}; announce(t('selectionCleared')); } // Fix (batch select): filter change clears selection (announced once, not per keystroke)
    el.btnClearSearch.classList.toggle('hidden', el.inpSearch.value.length === 0);
    renderList();
    var shown = state.filter.trim() ? getFilteredItems().length : state.items.length;
    el.itemCount.textContent = t('itemCount', { n: shown });
    // Debounced screen reader announcement of search result count
    clearTimeout(el.inpSearch._announceTimer);
    el.inpSearch._announceTimer = setTimeout(function(){
      if (state.filter.trim()){
        if (shown === 0) announce(t('resultsNone'));
        else announce(t('resultsFound', { n: shown }));
      }
    }, 400);
  });
  el.btnClearSearch.addEventListener('click', function(){
    el.inpSearch.value = '';
    state.filter = '';
    state.page = 1;
    state.editingId = null;
    if (countSelection() > 0){ state.selectedIds = {}; announce(t('selectionCleared')); } // Fix (batch select)
    el.btnClearSearch.classList.add('hidden');
    renderList();
    el.itemCount.textContent = t('itemCount', { n: state.items.length });
    el.inpSearch.focus();
  });
  el.btnReportClose.addEventListener('click', hideImportReport);
  el.btnTheme.addEventListener('click', function(){
    toggleTheme();
    applyStaticText(); // refresh aria-checked + labels
  });
  el.btnShortcuts.addEventListener('click', openShortcuts);
  el.ksClose.addEventListener('click', closeShortcuts);
  el.ksOverlay.addEventListener('click', function(ev){
    if (ev.target === el.ksOverlay) closeShortcuts();
  });
  // Fix: Tab focus trap for the cheat-sheet modal, mirroring #overlay (audit #3)
  el.ksOverlay.addEventListener('keydown', function(ev){
    if (ev.key !== 'Tab') return;
    var focusables = el.ksOverlay.querySelectorAll('button:not([disabled]):not(.hidden)');
    if (!focusables.length) return;
    var first = focusables[0];
    var last = focusables[focusables.length - 1];
    if (ev.shiftKey){
      if (document.activeElement === first || document.activeElement === el.ksOverlay){
        ev.preventDefault(); last.focus();
      }
    } else {
      if (document.activeElement === last){
        ev.preventDefault(); first.focus();
      }
    }
  });
  document.addEventListener('keydown', function(ev){
    // "?" opens the cheat sheet (not when typing in inputs/textarea)
    if (ev.key === '?' && !ev.isComposing){
      var tag = document.activeElement && document.activeElement.tagName;
      if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT'){
        ev.preventDefault();
        openShortcuts();
      }
    }
  });
  el.pagination.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('.page-btn') : null;
    if (!b || b.disabled) return;
    var p = parseInt(b.getAttribute('data-page'), 10);
    if (!isNaN(p)){
      state.page = p;
      state.editingId = null; // editing row is on another page
      state.selectedIds = {}; // Fix (batch select): pagination change clears selection
      renderList();
      announce(t('pageOf', { p: p, t: Math.max(1, Math.ceil(getFilteredItems().length / state.pageSize)) }));
    }
  });
  el.btnSortName.addEventListener('click', function(){ cycleSort('name'); });
  el.btnSortLoc.addEventListener('click', function(){ cycleSort('location'); });
  el.btnSortCat.addEventListener('click', function(){ cycleSort('category'); }); // Fix (category)
  el.selectAll.addEventListener('change', toggleSelectAll); // Fix (batch select)
  el.btnDelSelected.addEventListener('click', handleDeleteSelected); // Fix (batch select)
  /* Fix (bulk edit): event wiring — trigger, checkbox↔input enable/disable,
     Enter submits step 1, per-overlay traps/backdrop/Escape are handled below */
  el.btnEditSelected.addEventListener('click', handleEditSelected);
  el.bulkChkName.addEventListener('change', bulkToggleInputs);
  el.bulkChkLoc.addEventListener('change', bulkToggleInputs);
  el.bulkChkAmount.addEventListener('change', bulkToggleInputs);
  el.bulkChkCategory.addEventListener('change', bulkToggleInputs); // Fix (category)
  /* Fix (category dropdown): bulk Category is a <select> too (its options are refreshed in
     bulkResetFields); auto-capitalize now lives on the "new category" modal input. */
  setupCategorySelect(el.bulkInpCategory);
  [el.bulkInpName, el.bulkInpLoc, el.bulkInpAmount, el.bulkInpCategory].forEach(function(inp){
    inp.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' && !ev.isComposing){
        ev.preventDefault();
        if (catModalIsOpen()) return; // the "new category" modal owns Enter while it is open
        el.bulkContinue.click(); // Enter in a bulk field submits step 1 (mirrors the depot modal)
      }
    });
    inp.addEventListener('input', function(){ setInvalid(inp, false); }); // Fix (a11y audit C1): typing clears
  });
  el.bulkContinue.addEventListener('click', handleBulkContinue);
  el.bulkCancel1.addEventListener('click', closeBulk1);
  el.bulkApply.addEventListener('click', handleBulkApply);
  el.bulkCancel2.addEventListener('click', closeBulk2); // closes both steps (spec: simpler)
  el.bulkClose3.addEventListener('click', closeBulk3);
  [el.bulkOverlay1, el.bulkOverlay2, el.bulkOverlay3].forEach(function(ov){
    ov.addEventListener('click', function(ev){
      // backdrop click cancels the whole flow
      if (ev.target === ov){ ov.classList.add('hidden'); bulkPlan = null; bulkFocusAfterClose(); }
    });
    ov.addEventListener('keydown', bulkTabTrap); // a11y: Tab focus trap per visible overlay
  });
  /* Fix (new category modal): open/save/cancel, Tab trap, backdrop click, live Save state */
  el.catModalSave.addEventListener('click', saveCategoryModal);
  el.catModalCancel.addEventListener('click', cancelCategoryModal);
  el.catOverlay.addEventListener('click', function(ev){
    if (ev.target === el.catOverlay) cancelCategoryModal(); // backdrop click = cancel
  });
  el.catOverlay.addEventListener('keydown', function(ev){
    if (ev.key !== 'Tab') return;
    /* Disabled controls (the Save button before a name is typed) stay out of the trap. */
    var f = el.catOverlay.querySelectorAll('button:not([disabled]):not(.hidden),input:not([disabled]):not(.hidden)');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (ev.shiftKey){
      if (document.activeElement === first || document.activeElement === el.catOverlay){ ev.preventDefault(); last.focus(); }
    } else {
      if (document.activeElement === last){ ev.preventDefault(); first.focus(); }
    }
  });
  el.catModalInput.addEventListener('input', function(){
    autoCapitalizeFirst(el.catModalInput); // same first-letter rule as Name/Location/Category
    setInvalid(el.catModalInput, false);
    el.catModalSave.disabled = el.catModalInput.value.trim() === ''; // Save needs a non-empty name
  });
  el.catModalInput.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.isComposing){
      ev.preventDefault();
      saveCategoryModal(); // Enter confirms, like the other input modals
    }
  });
  /* Fix (settings): the gear opens the settings dialog; controls apply live */
  el.btnSettings.addEventListener('click', openSettings);
  el.setClose.addEventListener('click', closeSettings);
  el.settingsOverlay.addEventListener('click', function(ev){
    if (ev.target === el.settingsOverlay) closeSettings(); // backdrop = close
  });
  el.settingsOverlay.addEventListener('keydown', settingsTabTrap); // a11y: Tab focus trap
  el.setLang.addEventListener('change', onSettingsLangChange);
  el.setFont.addEventListener('change', onSettingsFontChange);
  el.setIcon.addEventListener('change', onSettingsIconChange);
  el.btnResetSettings.addEventListener('click', onResetSettings);
  el.btnExport.addEventListener('click', handleExport);
  el.btnImportTrigger.addEventListener('click', function(){
    try { el.inpImport.click(); } catch(e){}
  });
  el.inpImport.addEventListener('change', function(){
    if (el.inpImport.files && el.inpImport.files[0]){
      handleImportFile(el.inpImport.files[0]);
    }
    el.inpImport.value = ''; // allow re-selecting the same file later
  });
  el.modalOk.addEventListener('click', function(){ closeConfirm(true); });
  el.modalCancel.addEventListener('click', function(){ closeConfirm(false); });
  el.modalInput.addEventListener('input', function(){ setInvalid(el.modalInput, false); }); // Fix (a11y audit C1): typing clears
  el.modalInput.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.isComposing){
      ev.preventDefault();
      closeConfirm(true); // Save (value is read by askInput's resolver)
    }
  });
  el.overlay.addEventListener('click', function(ev){
    if (ev.target === el.overlay) closeConfirm(false); // backdrop click cancels
  });
  // Focus trap: Tab cycles within the modal while open (a11y)
  el.overlay.addEventListener('keydown', function(ev){
    if (ev.key !== 'Tab') return;
    var focusables = el.overlay.querySelectorAll('button:not([disabled]):not(.hidden),input:not([disabled]):not(.hidden)'); // Fix: exclude hidden controls from the trap (audit #11)
    if (!focusables.length) return;
    var first = focusables[0];
    var last = focusables[focusables.length - 1];
    if (ev.shiftKey){
      if (document.activeElement === first || document.activeElement === el.overlay){
        ev.preventDefault(); last.focus();
      }
    } else {
      if (document.activeElement === last){
        ev.preventDefault(); first.focus();
      }
    }
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape'){
      if (!el.catOverlay.classList.contains('hidden')){
        /* Fix (new category modal): it is the topmost surface, so it closes first —
           the Category value is left untouched and focus returns to the dropdown. */
        cancelCategoryModal();
      } else if (!el.iconPickerOverlay.classList.contains('hidden')){
        closeIconPicker(); // Fix (depot icon picker): Escape closes, focus returns to the icon button
      } else if (bulkIsOpen()){
        // Fix (bulk edit): Escape closes whichever bulk step is visible (whole flow)
        if (!el.bulkOverlay1.classList.contains('hidden')) closeBulk1();
        else if (!el.bulkOverlay2.classList.contains('hidden')) closeBulk2();
        else closeBulk3();
      } else if (!el.overlay.classList.contains('hidden')){
        closeConfirm(false);
      } else if (!el.settingsOverlay.classList.contains('hidden')){
        closeSettings(); // Fix (settings): Escape closes the settings dialog
      } else if (depotMenuIsOpen()){
        closeDepotMenu();
        el.depotSelect.focus();
      } else if (!el.ksOverlay.classList.contains('hidden')){
        closeShortcuts();
      } else if (state.editingId !== null){
        // Fix (Phase 5): inline edit has priority over the Add/Import section — the
        // edit inputs' own Escape handlers cancel it (they stopPropagation)
      } else if (!el.formCard.classList.contains('hidden')){
        el.btnCloseForm.click(); // Fix (Phase 5): Escape closes the Add/Import section (same as the close button)
      }
    }
  });
  // ---- Depot icon picker (Fix: depot icon picker) ----
  el.btnDepotIcon.addEventListener('click', openIconPicker);
  el.iconPickerSave.addEventListener('click', savePendingIcon);   // Fix (save/cancel): commits the pending icon
  el.iconPickerCancel.addEventListener('click', closeIconPicker); // Fix (save/cancel): discards it
  el.iconPickerOverlay.addEventListener('click', function(ev){
    if (ev.target === el.iconPickerOverlay) closeIconPicker(); // backdrop click = Cancel
  });
  el.iconPickerOverlay.addEventListener('keydown', iconPickerKeydown); // trap + arrow grid nav
  // ---- Depot selector ----
  el.depotSelect.addEventListener('click', function(){
    if (depotMenuIsOpen()){ closeDepotMenu(); el.depotSelect.focus(); }
    else { openDepotMenu(); }
  });
  el.depotSelect.addEventListener('keydown', function(ev){
    if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && !depotMenuIsOpen()){
      ev.preventDefault();
      openDepotMenu();
    }
  });
  el.depotMenu.addEventListener('keydown', function(ev){
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
      ev.preventDefault();
      var names = Array.prototype.slice.call(el.depotMenu.querySelectorAll('.dd-name'));
      if (!names.length) return;
      var idx = names.indexOf(document.activeElement);
      var next;
      if (ev.key === 'ArrowDown') next = (idx === -1) ? 0 : Math.min(names.length - 1, idx + 1);
      else next = (idx === -1) ? names.length - 1 : Math.max(0, idx - 1);
      names[next].focus();
    }
  });
  document.addEventListener('click', function(ev){
    if (depotMenuIsOpen() &&
        !el.depotMenu.contains(ev.target) &&
        !el.depotSelect.contains(ev.target)){
      closeDepotMenu();
    }
  });
}

function init(){
  // Bootstrap check: translations must have loaded from translations.js
  if (!languagesValid(window.DEPOT_LANGUAGES)){
    el.appRoot.classList.add('hidden');
    el.bootstrapError.classList.remove('hidden');
    return; // app stays inert; message is intentionally hardcoded English
  }
  checkStorage();
  state.lang = detectLang(); // runs BEFORE data load so migration can pick the language
  /* Fix (settings): load the saved scales (the head script already applied them pre-paint;
     this syncs state and guarantees the values are applied on every start) */
  state.fontScale = readScale(LS_FONT);
  state.iconScale = readScale(LS_ICON);
  applyFontScale(state.fontScale);
  applyIconScale(state.iconScale);
  var loaded = { ok: true, empty: true };
  if (DC.store.ok){
    loaded = loadState();
  } else {
    el.banner.textContent = t('storageWarn');
    el.banner.classList.remove('hidden');
  }
  if (loaded.ok && loaded.data){
    state.depots = loaded.data.depots;
    state.activeDepotId = loaded.data.activeDepotId;
    state.nextDepotId = loaded.data.nextDepotId;
    state.nextItemId = loaded.data.nextItemId;
    /* Fix (depot icon picker): old data/snapshots without the map load as {} */
    state.depotIcons = (loaded.data.depotIcons && typeof loaded.data.depotIcons === 'object') ? loaded.data.depotIcons : {};
    syncItemsRef();
    if (loaded.migrated){
      persist(); snapshotCurrentData(); // write the migrated v2 state immediately
    }
  } else if (!loaded.ok){
    setTimeout(function(){ showToast(t('corruptWarn'), 'warn'); announce(t('corruptWarn'), true); }, 400);
  }
  if (state.depots.length === 0){
    // Fresh start (or everything deleted): create the default depot
    state.depots = [{ id: 1, name: t('defaultDepotName'), items: [] }];
    state.activeDepotId = 1;
    state.nextDepotId = 2;
    state.nextItemId = 1;
    syncItemsRef();
    persist(); // make the fresh state durable right away
  }
  bindEvents();
  applyTheme(currentTheme()); // sync switch state with the active theme
  render();
  applyFavicon(); // Fix (depot icon picker): favicon from the active depot's emoji on load
  try { el.inpSearch.focus(); } catch(e){} // start typing a search right away
}
init();
})();
</script>
</body>
</html>
