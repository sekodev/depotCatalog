<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Depo Kataloğu / Depot Catalog - offline single-file app">
<title>Depot Catalog</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<script>
/* Apply the saved (or system) theme before first paint to avoid a flash */
(function(){
  try {
    var t = null;
    try { t = localStorage.getItem('depotCatalog.theme'); } catch(e){}
    if (t !== 'dark' && t !== 'light'){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>
<style>
/* ---------- Reset & theme tokens ---------- */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f8;
  --surface:#ffffff;
  --text:#1d2733;
  --muted:#5b6b7b;
  --border:#d7dee6;
  --accent:#1663c7;
  --accent-hover:#0e4fa3;
  /* Fix (Phase 3 contrast): solid tokens for white-text backgrounds.
     Light values equal the text accents (white on #1663c7 = 5.76:1, AA). */
  --accent-solid:#1663c7;
  --accent-solid-hover:#0e4fa3;
  --danger:#c0392b;
  --danger-solid:#c0392b;
  --danger-bg:#fdecea;
  --radius:10px;
  --shadow:0 1px 3px rgba(16,24,40,.08);
}
:root[data-theme="dark"]{
  --bg:#12161c;
  --surface:#1b222b;
  --text:#e8edf3;
  --muted:#9aa8b6;
  --border:#2c3642;
  --accent:#4d94f0;
  --accent-hover:#6ba7f4;
  /* Fix (Phase 3 contrast): --danger #e05a4e -> #e8715f — danger text was 4.38:1 on
     surface and 3.98:1 on danger-bg; now 5.31:1 and 4.82:1 (WCAG AA). */
  --danger:#e8715f;
  /* Fix (Phase 3 contrast): solid backgrounds for white text — white on #4d94f0 was
     only 3.08:1; #2f6fc0 gives 5.05:1, hover #27629f 6.30:1, #b33629 6.04:1 (AA). */
  --accent-solid:#2f6fc0;
  --accent-solid-hover:#27629f;
  --danger-solid:#b33629;
  --danger-bg:#3a2320;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12161c;
    --surface:#1b222b;
    --text:#e8edf3;
    --muted:#9aa8b6;
    --border:#2c3642;
    --accent:#4d94f0;
    --accent-hover:#6ba7f4;
    /* Fix (Phase 3 contrast): mirror of the data-theme block — see comments there. */
    --danger:#e8715f;
    --accent-solid:#2f6fc0;
    --accent-solid-hover:#27629f;
    --danger-solid:#b33629;
    --danger-bg:#3a2320;
    --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
html{font-size:16px;-webkit-text-size-adjust:100%;overflow-y:scroll}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;
  padding:calc(env(safe-area-inset-top,0px) + 1rem) 1rem calc(env(safe-area-inset-bottom,0px) + 2.5rem);
}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
/* Fix (Phase 3 landmarks): <main> replicates .wrap spacing so wrapping the content changes no visuals */
#appMain{display:flex;flex-direction:column;gap:1rem}

/* ---------- Header ---------- */
header{display:flex;justify-content:space-between;align-items:center;gap:.75rem;flex-wrap:wrap}
h1{font-size:1.35rem;display:flex;align-items:center;gap:.5rem}
.lang-switch{display:flex;border:1px solid var(--border);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang-switch button{
  background:none;border:none;padding:.35rem .85rem;font-size:.85rem;font-weight:700;
  color:var(--muted);cursor:pointer;min-height:44px;min-width:52px;
}
.lang-switch button[aria-pressed="true"]{background:var(--accent-solid);color:#fff} /* Fix (Phase 3): 5.05:1 dark */

/* ---------- Search wrap & clear button ---------- */
.search-wrap{position:relative;display:flex;align-items:center}
.search-wrap .search-input{width:100%;padding-right:2.6rem}
.clear-btn{
  position:absolute;right:5px;top:50%;transform:translateY(-50%);
  width:34px;height:34px;min-height:0;padding:0;
  border:none;border-radius:6px;background:none;
  font-size:1.15rem;line-height:1;color:var(--muted);cursor:pointer;
}
.clear-btn:hover{color:var(--text);background:var(--bg)}

/* ---------- Cards & form ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow)}
.card h2{font-size:1rem;margin-bottom:.75rem}
form#productForm{display:grid;gap:.75rem;grid-template-columns:1fr}
.field label{display:block;font-size:.8rem;font-weight:600;margin-bottom:.25rem;color:var(--muted)}
input[type="text"],input[type="search"],input[type="number"]{
  width:100%;padding:.65rem .75rem;font-size:1rem;
  border:1px solid var(--border);border-radius:8px;
  background:var(--bg);color:var(--text);
}
input:focus-visible,button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{font-size:.82rem;color:var(--danger);margin-top:.3rem;min-height:1.2em;line-height:1.2} /* Fix (Phase 5): reserved line + fixed line-height (emoji glyphs otherwise inflate the box) — errors no longer shift the form layout */
.search-input{margin-bottom:.25rem}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.45rem;
  padding:.6rem 1.05rem;font-size:.95rem;font-weight:600;
  border:none;border-radius:8px;cursor:pointer;min-height:44px;
  font-family:inherit;
}
/* Fix (Phase 3 contrast): white label on --accent-solid = 5.76:1 light / 5.05:1 dark (AA) */
.btn-primary{background:var(--accent-solid);color:#fff}
.btn-primary:hover{background:var(--accent-solid-hover)}
.btn-secondary{background:transparent;color:var(--accent);border:1px solid var(--border)}
.btn-secondary:hover{border-color:var(--accent)}
/* Fix (Phase 3 contrast): white label on --danger-solid = 5.44:1 light / 6.04:1 dark (was 3.66:1 dark) */
.btn-danger{background:var(--danger-solid);color:#fff}
.form-actions{display:flex;flex-direction:row;gap:.5rem;align-items:end}
.hidden{display:none!important}
/* Fix: removed duplicate .sr-only one-liner; the canonical block below is identical (audit #9) */

/* ---------- Stock list ---------- */
.list-card{padding:0;overflow:hidden}
.list-head{
  display:grid;grid-template-columns:auto 2fr 1.5fr 1fr auto;gap:.75rem;align-items:center;
  padding:.6rem 1rem;font-size:.75rem;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  border-bottom:1px solid var(--border);
}
/* Fix (revert): Location/Amount headers are left-aligned again — the center rule for these two headers was removed with this change */
/* Fix (sortable columns): the header buttons look like the old plain labels */
.sort-btn{
  background:none;border:none;padding:0;margin:0;
  font:inherit;letter-spacing:inherit;text-transform:inherit;
  color:inherit;cursor:pointer;text-align:left;
}
.sort-btn:hover{color:var(--accent)}
.sort-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Fix (batch select): checkbox column — select-all header cell + row checkboxes */
.check-head{display:flex;align-items:center}
.row .check{display:flex;align-items:center}
.row.editing .check{flex:none;align-self:center}
input[type="checkbox"]{accent-color:var(--accent);width:18px;height:18px}
.row{
  display:grid;grid-template-columns:auto 2fr 1.5fr 1fr auto;gap:.75rem;align-items:center;
  padding:.6rem 1rem;border-bottom:1px solid var(--border);
}
.row:last-child{border-bottom:none}
.row .name{word-break:break-word}
.row .loc{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;line-height:1.2;word-break:break-word} /* Fix: line-height:1.2 — identical vertical metrics with Amount; left-aligned (revert) */
.row .amount{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;line-height:1.2;word-break:break-word} /* Fix (vertical alignment): same mono font + line-height as Location — identical line box; left-aligned (revert) */
.row .actions{display:flex;gap:.35rem}
.icon-btn{
  background:none;border:1px solid transparent;border-radius:8px;
  width:44px;height:44px;font-size:1.15rem;line-height:1;cursor:pointer;
  color:var(--muted);
}
.icon-btn:hover{background:var(--bg);color:var(--text)}
.icon-btn.del:hover{color:var(--danger);background:var(--danger-bg)}
.empty-state{padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.95rem;line-height:1.5}

/* ---------- Toolbar ---------- */
/* Fix (toolbar layout): Export + bulk actions (left) · Add/Import (right).
   Page-size selector + total count moved into the stock list card, below the
   pagination controls (Fix: list footer). Hidden bulk buttons (display:none)
   never leave a gap or push the other controls. */
.toolbar{display:flex;flex-direction:column;gap:.45rem}
.toolbar-row{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.toolbar .group-export{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.center-row{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;justify-content:center;margin:0 auto}
.toolbar .btn-toggle-add{margin-left:auto;white-space:nowrap} /* Fix: Add/Product button aligns to the right edge */
/* Reserve layout space while the form is open so the center stays fixed */
.toolbar .btn-toggle-add.invisible{visibility:hidden;pointer-events:none}
.count{font-size:.87rem;color:var(--muted)}
/* Fix (list footer): page-size selector + total count below the pagination */
.list-foot{display:flex;flex-direction:column;align-items:center;gap:.4rem}

/* ---------- Import area inside add form ---------- */
.import-area{
  margin-top:1rem;padding-top:.9rem;border-top:1px dashed var(--border);
  display:flex;flex-direction:column;gap:.5rem;align-items:flex-start;
}

/* ---------- Import report & modal list ---------- */
.import-report .form-head{margin-bottom:.5rem}
.report-lines{white-space:pre-line;font-size:.87rem;color:var(--muted);margin:0 0 .35rem}
.report-list{
  list-style:none;margin:0;padding:0;
  font-size:.85rem;color:var(--muted);
}
.report-list li{padding:.3rem 0;border-bottom:1px solid var(--border);word-break:break-word}
.report-list li.report-header{
  font-weight:700;color:var(--text);
  border-bottom:none;padding-bottom:.15rem;
}
.report-list li.report-header:not(:first-child){margin-top:.7rem}
.report-list li:last-child{border-bottom:none}
.modal-list{
  list-style:none;margin:0 0 .25rem;padding:0;
  max-height:180px;overflow-y:auto;
  font-size:.85rem;color:var(--muted);
}
.modal-list li{padding:.25rem 0;border-bottom:1px solid var(--border);word-break:break-word}
.modal-list li:last-child{border-bottom:none}

/* ---------- Banner / Modal / Toast ---------- */
.banner{
  background:var(--danger-bg);color:var(--danger);border:1px solid var(--danger);
  border-radius:var(--radius);padding:.7rem 1rem;font-size:.9rem;line-height:1.45;
}
.overlay{
  position:fixed;inset:0;background:rgba(10,14,20,.55);
  display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50;
}
.modal{
  background:var(--surface);border-radius:var(--radius);
  max-width:420px;width:100%;padding:1.25rem;
  box-shadow:0 12px 32px rgba(0,0,0,.28);
}
.modal h2{font-size:1.05rem;margin-bottom:.5rem}
.modal p{font-size:.95rem;color:var(--muted);margin-bottom:1.1rem;line-height:1.5;white-space:pre-line}
.modal-actions{display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:max(1.25rem,env(safe-area-inset-bottom,0px));
  background:var(--surface);color:var(--text);
  border:1px solid var(--border);
  padding:.7rem 1.15rem;border-radius:10px;font-size:.9rem;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
  z-index:60;opacity:0;transition:opacity .25s ease;
  pointer-events:none;max-width:90vw;text-align:center;
}
.toast.show{opacity:1}
.toast-success{border-left:4px solid #2e9e5b}
.toast-warn{border-left:4px solid #e6a23c}
.toast-error{border-left:4px solid #e0524a}
.toast-info{border-left:4px solid var(--accent)}

/* ---------- Name suggestions dropdown ---------- */
.field{position:relative}
.suggest{
  position:absolute;top:100%;left:0;right:0;z-index:20;margin-top:.15rem;
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  box-shadow:0 6px 18px rgba(0,0,0,.18);max-height:220px;overflow-y:auto;
}
.suggest-item{
  display:flex;justify-content:space-between;gap:.75rem;
  padding:.55rem .75rem;font-size:.92rem;cursor:default;
  border-bottom:1px solid var(--border);
}
.suggest-item:last-child{border-bottom:none}
.suggest-item .sg-name{word-break:break-word}
.suggest-item .sg-loc{color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap}

/* ---------- Add-form toggle & close ---------- */
.form-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;gap:.5rem}
.form-head h2{margin-bottom:0}
#btnCloseForm{border:1px solid var(--border)}

/* ---------- Inline row editing ---------- */
.row.editing{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;
  background:rgba(77,148,240,.12);box-shadow:inset 3px 0 0 var(--accent)}
.row.editing .edit-field{flex:1 1 150px;min-width:0}
.edit-input{
  width:100%;padding:.4rem .55rem;font-size:1rem;
  border:1px solid var(--accent);border-radius:6px;
  background:var(--surface);color:var(--text);font-family:inherit;
}
/* Fix (revert): the Location/Amount inline inputs are left-aligned again — the centering rule for these two inputs was removed */
.edit-input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn-sm{min-height:38px;min-width:38px;padding:.3rem .65rem;font-size:.85rem}

/* ---------- Page-size selector ---------- */
.psize{display:inline-flex;align-items:center;gap:.4rem}
.psize select{
  padding:.3rem .5rem;font-size:.9rem;min-height:38px;
  border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--text);font-family:inherit;cursor:pointer;
}


/* ---------- Footer disclaimer ---------- */
.disclaimer{text-align:center;font-size:.8rem;color:var(--muted)}
.copyright{display:block;margin-top:.3rem}

/* ---------- GitHub header link ---------- */
.gh-link{
  display:inline-flex;align-items:center;justify-content:center;
  width:44px;height:44px;border-radius:8px;color:var(--muted);
}
.gh-link:hover{color:var(--text);background:var(--bg)}
.gh-link svg{width:22px;height:22px;fill:currentColor}

/* ---------- Theme switch ---------- */
.theme-switch{
  position:relative;width:48px;height:26px;border-radius:999px;
  border:1px solid var(--border);background:var(--bg);cursor:pointer;
  transition:background .2s ease;flex:none;
}
.theme-switch::after{
  content:'';position:absolute;top:2px;left:2px;width:20px;height:20px;
  border-radius:50%;background:var(--surface);border:1px solid var(--border);
  box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s ease;
}
.theme-switch[aria-checked="true"]{background:var(--accent-solid)} /* Fix (Phase 3): white knob 5.05:1 dark */
.theme-switch[aria-checked="true"]::after{left:24px;background:#fff}
.theme-switch:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.theme-switch .sw-icon{
  position:absolute;top:50%;transform:translateY(-50%);
  font-size:.72rem;line-height:1;pointer-events:none;
}
/* Only the icon for the ACTIVE theme is visible:
   light -> sun (right, opposite the knob), dark -> moon (left) */
.theme-switch .sw-sun{right:6px}
.theme-switch .sw-moon{left:6px;display:none}
.theme-switch[aria-checked="true"] .sw-sun{display:none}
.theme-switch[aria-checked="true"] .sw-moon{display:block}

/* ---------- Depot selector (title area) ---------- */
.title-area{
  position:relative;display:flex;align-items:center;gap:.4rem;
  min-width:0;font-size:1.35rem;margin:0;
}
.app-icon{flex:none}
.depot-select{
  display:inline-flex;align-items:center;gap:.4rem;min-width:0;
  background:none;border:none;color:var(--text);cursor:pointer;
  padding:.3rem .5rem;border-radius:8px;
  font-size:1.2rem;font-weight:700;font-family:inherit;
}
.depot-select:hover{background:var(--bg)}
.depot-select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#depotSelectName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-caret{font-size:inherit;line-height:1;color:var(--muted);flex:none}
.row.editing .hint-inline{flex-basis:100%;margin-top:.15rem}
.depot-menu{
  position:absolute;top:calc(100% + 6px);left:0;min-width:250px;max-width:min(340px,calc(100vw - 2rem));
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.22);z-index:80;padding:.35rem;
  display:flex;flex-direction:column;gap:.15rem;
}
.dd-row{display:flex;align-items:center;gap:.25rem;padding:.15rem .25rem;border-radius:8px}
.dd-row:hover{background:var(--bg)}
.dd-name{
  flex:1;min-width:0;text-align:left;background:none;border:none;
  color:var(--text);font-size:.95rem;font-weight:600;cursor:pointer;
  padding:.5rem .5rem;border-radius:6px;font-family:inherit;overflow-wrap:anywhere;
}
.dd-name:hover{background:var(--bg)}
.dd-name:focus-visible{outline:2px solid var(--accent)}
.dd-name[aria-selected="true"]{font-weight:700;background:var(--bg)}
.dd-row .icon-btn{flex:none;width:36px;height:36px;font-size:1rem}
.dd-add-row{border-top:1px solid var(--border);margin-top:.3rem;padding-top:.3rem}
.dd-add{
  width:100%;text-align:left;background:none;border:none;
  color:var(--accent);font-weight:600;cursor:pointer;
  padding:.55rem .5rem;border-radius:6px;font-family:inherit;font-size:.95rem;
}
.dd-add:hover{background:var(--bg)}
.dd-add:focus-visible{outline:2px solid var(--accent)}
.modal-input{
  width:100%;padding:.55rem .65rem;font-size:1rem;margin-bottom:1rem;
  border:1px solid var(--accent);border-radius:8px;
  background:var(--surface);color:var(--text);font-family:inherit;
}
.modal-input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* Fix (bulk edit): step modals — checkbox+label+input rows, hints and warnings */
.bulk-modal{max-width:480px}
.bulk-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.6rem}
.bulk-row input[type="checkbox"]{width:1.1rem;height:1.1rem;flex:none}
.bulk-row label{flex:none;min-width:5.5rem;font-size:.95rem;font-weight:600}
.bulk-row input[type="text"],.bulk-row input[type="number"]{flex:1;min-width:0}
.bulk-row input:disabled{opacity:.45}
.bulk-hint{font-size:.9rem;color:var(--muted);margin:0 0 .6rem;line-height:1.4}
.bulk-warn{font-size:.85rem;color:var(--warn, #b8860b);margin:.2rem 0 .4rem}
.bulk-modal .modal-list{max-height:220px}

/* Save indicator: small subtle pill on the same line, right of the depot selector */
.depot-select-wrap{display:inline-flex;align-items:center;gap:.55rem;min-width:0}
.save-indicator{
  font-size:.8rem;color:var(--muted);
  background:var(--surface);border:1px solid var(--border);border-radius:999px;
  box-shadow:var(--shadow);
  padding:.22rem .6rem;white-space:nowrap;
  display:inline-flex;align-items:center;gap:.35rem;flex:none;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease, visibility 0s linear .25s;
  visibility:hidden;
}
.save-indicator.show{
  opacity:1;pointer-events:auto;visibility:visible;
  transition:opacity .25s ease;
}
@media (prefers-reduced-motion: reduce){
  .save-indicator{transition:none}
  .save-indicator.show{transition:none}
  .toast{transition:none}
  .theme-switch{transition:none}
  .theme-switch::after{transition:none}
}
/* Fix: removed dead .save-indicator:focus-visible rule — element is aria-hidden and not focusable (audit #9) */

/* ---------- Keyboard shortcuts ("?") button & cheat sheet modal ---------- */
.ks-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);cursor:pointer;
  font-size:.85rem;font-weight:700;font-family:inherit;
}
.ks-btn:hover{color:var(--text);background:var(--bg)}
.ks-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ks-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:120;
  display:flex;align-items:center;justify-content:center;padding:1rem;
}
.ks-modal{
  background:var(--surface);border:1px solid var(--border);border-radius:10px;
  box-shadow:0 8px 24px rgba(0,0,0,.3);
  max-width:480px;width:100%;max-height:80vh;
  display:flex;flex-direction:column;padding:1.25rem;
}
.ks-modal h2{font-size:1.05rem;margin-bottom:.75rem}
.ks-body{overflow-y:auto;flex:1;font-size:.87rem}
.ks-section{margin-bottom:.9rem}
.ks-section:last-child{margin-bottom:0}
.ks-section h3{font-size:.85rem;font-weight:700;color:var(--accent);margin:0 0 .35rem}
.ks-rows{margin:0;padding:0;list-style:none}
.ks-rows li{display:flex;gap:.5rem;padding:.15rem 0;align-items:baseline}
.ks-key{
  flex:none;min-width:7rem;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.8rem;background:var(--bg);border:1px solid var(--border);
  border-radius:4px;padding:.1rem .35rem;text-align:center;color:var(--text);
}
.ks-desc{color:var(--muted)}
.hint-inline{font-size:.8rem;color:var(--muted)}
/* Fix (Location alignment): the hint is a normal block below the input. It was
   position:absolute, which (a) overlapped the next field on mobile when visible and
   (b) left the Location field shorter than Name/Amount (which reserve an error line),
   so the desktop row (align-items:end) dropped the Location input ~1.28rem lower. */
#hintAddJump{margin-top:.3rem;line-height:1.2}

/* ---------- Accessibility: skip link & modal focus helpers ---------- */
.sr-only{
  position:absolute;width:1px;height:1px;
  padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0;
}
.skip-link{
  position:fixed;top:.5rem;left:.5rem;z-index:200;
  padding:.6rem 1rem;border-radius:8px;
  background:var(--accent-solid);color:#fff;font-weight:600;font-size:.9rem; /* Fix (Phase 3): solid token, 5.05:1 dark */
  text-decoration:none;
  clip:rect(0 0 0 0);clip-path:inset(50%);overflow:hidden;
  white-space:nowrap;width:1px;height:1px;
}
.skip-link:focus{
  clip:auto;clip-path:none;overflow:visible;width:auto;height:auto;
}

/* ---------- Pagination ---------- */
.pagination{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:.35rem;padding:.65rem;border-top:1px solid var(--border);
}
.page-btn{
  background:var(--surface);border:1px solid var(--border);border-radius:8px;
  min-width:44px;min-height:44px;padding:0 .7rem;font-size:.9rem;
  color:var(--text);cursor:pointer;font-family:inherit;
}
.page-btn:hover:not([disabled]):not(.active){border-color:var(--accent);color:var(--accent)}
.page-btn.active{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff;font-weight:700} /* Fix (Phase 3): 5.05:1 dark */
.page-btn[disabled]{opacity:.45;cursor:default}
.page-ellipsis{color:var(--muted);padding:0 .25rem}



/* ---------- Responsive: desktop ---------- */
@media (min-width:721px){
  /* Fix (Location alignment): align-items start — all three inputs share the same
     top edge; the reserved error/hint areas hang below the inputs without moving them
     (end-alignment dropped the shorter Location input ~1.28rem lower). */
  form#productForm{grid-template-columns:2fr 1.5fr 1fr auto;align-items:start}
  /* Fix (Location alignment): push the submit button down past the label, onto the
     input line (replaces the Phase 5 margin-bottom bottom-alignment hack) */
  .form-actions{margin-top:1.21rem}
  .search-wrap{max-width:440px}
}

/* ---------- Responsive: mobile ---------- */
@media (max-width:720px){
  body{padding-left:.75rem;padding-right:.75rem}
  h1{font-size:1.15rem}
  header{flex-direction:column;align-items:stretch}
  .title-area{width:100%;font-size:1.2rem}
  .header-controls{justify-content:flex-end}
  /* Fix (batch select): mobile shows a slim header row with only the select-all
     checkbox (text headers stay hidden as before) */
  .list-head{display:grid;grid-template-columns:auto 1fr;padding:.45rem .85rem}
  .list-head > div:not(.check-head){display:none}
  .row{
    grid-template-columns:auto 1fr auto;
    grid-template-areas:"check name actions" "check loc actions" "check amount actions";
    row-gap:.2rem;padding:.7rem .85rem;
  }
  .row .name{grid-area:name;font-weight:600}
  .row .loc{grid-area:loc}
  .row .amount{grid-area:amount}
  .row .check{grid-area:check}
  .row .actions{grid-area:actions;flex-direction:column;align-self:center}
  .toolbar{gap:.7rem}
  .toolbar .group-export{flex-direction:column;align-items:stretch}
  .toolbar .group-export .btn{width:100%}
  .toolbar .btn-toggle-add{margin-left:0;width:100%}
  .count{text-align:center}
  .import-area{width:100%;align-items:stretch}
  .import-area .btn{width:100%}
}
</style>

<script src="translations.js"></script>
<script>
(function(){
'use strict';

/* ================= Constants ================= */
var LS_DATA    = 'depotCatalog.data.v2';   // multi-depot storage (current)
var LS_LEGACY  = 'depotCatalog.items.v1';  // pre-multi-depot storage (migrated once)
var LS_LANG    = 'depotCatalog.lang';
var LS_THEME   = 'depotCatalog.theme';
var MAX_SNAPS = 5;

/* ============ i18n (strings live in external translations.js) ============ */
var LANGUAGES = window.DEPOT_LANGUAGES;
function languagesValid(arr){
  if (!Array.isArray(arr) || arr.length === 0) return false;
  for (var i = 0; i < arr.length; i++){
    var L = arr[i];
    if (!L || typeof L.code !== 'string' || typeof L.label !== 'string' ||
        !L.strings || typeof L.strings !== 'object' ||
        typeof L.strings.appTitle !== 'string') return false;
  }
  return true;
}
function getLang(code){
  for (var i = 0; i < LANGUAGES.length; i++){
    if (LANGUAGES[i].code === code) return LANGUAGES[i];
  }
  return null;
}
function detectLang(){
  var saved = null;
  try { saved = localStorage.getItem(LS_LANG); } catch(e){}
  if (saved && getLang(saved)) return saved;
  var langs = (navigator.languages && navigator.languages.length)
    ? navigator.languages : [navigator.language || ''];
  for (var i = 0; i < langs.length; i++){
    var p = String(langs[i] || '').toLowerCase();
    for (var j = 0; j < LANGUAGES.length; j++){
      var c = LANGUAGES[j].code.toLowerCase();
      if (p === c || p.indexOf(c + '-') === 0) return LANGUAGES[j].code;
    }
  }
  return getLang('en') ? 'en' : LANGUAGES[0].code; // fallback
}
function t(key, params){
  var cur = getLang(state.lang);
  var s = (cur && cur.strings && cur.strings[key] != null) ? cur.strings[key] : null;
  if (s == null){
    var en = getLang('en');
    if (en && en.strings && en.strings[key] != null) s = en.strings[key];
  }
  if (s == null) s = key;
  if (params){
    Object.keys(params).forEach(function(k){
      s = s.split('{' + k + '}').join(String(params[k]));
    });
  }
  return s;
}

/* ================= App state ================= */
var state = {
  depots: [],          // [{id, name, items:[{id,name,location}]}]
  activeDepotId: null,
  nextDepotId: 1,
  nextItemId: 1,
  items: [],           // LIVE alias of the active depot's items (kept in sync)
  filter: '',
  sort: { key: null, dir: null }, // Fix (sortable columns): UI state only — not persisted; reset on depot switch
  selectedIds: {}, // Fix (batch select): page-scoped selection map (id -> true); not persisted
  editingId: null,
  lang: 'en',
  page: 1,
  pageSize: 5
};
var storageOk = true;

/* ================= Depot helpers ================= */
function findDepot(id){
  for (var i = 0; i < state.depots.length; i++){
    if (state.depots[i].id === id) return state.depots[i];
  }
  return null;
}
function activeDepot(){
  return findDepot(state.activeDepotId);
}
/* Keep state.items pointing at the active depot's items array so every
   existing item operation (search, edit, delete, import...) is scoped. */
function syncItemsRef(){
  var d = activeDepot();
  state.items = d ? d.items : [];
}

/* ================= DOM refs ================= */
function $(id){ return document.getElementById(id); }
var el = {};
['btnLangTr','btnLangEn','banner','formTitle','productForm',
 'inpName','nameError','inpLoc','lblName','lblLoc','btnSubmit',
 'inpSearch','btnSortName','btnSortLoc','colNameHead','colLocHead','listBody','itemCount','btnExport','lblExport','listFoot',
 'btnImportTrigger','lblImport','inpImport','overlay','modalTitle','modalText',
 'modalOk','modalCancel','toast','formCard','nameSuggest','disclaimerText',
 'appRoot','bootstrapError','pagination','ghLink','btnToggleAdd','btnCloseForm',
 'selPageSize','lblPageSize','btnClearSearch','modalList','importReport',
 'impReportTitle','impReportSummary','impReportList','btnReportClose',
 'btnTheme','depotSelect','depotSelectName','depotMenu','modalInput',
 'toolbar','searchWrap','saveIndicator','saveIndText','skipLink',
 'btnShortcuts','ksOverlay','ksTitle','ksBody','ksClose','hintAddJump',
 'srAnnouncer','srAnnouncerAssertive','langSwitch','stockListTitle','lblImportFile',
 'inpAmount','lblAmount','amountError','colAmount','selectAll','btnDelSelected','delSelCount','editSelCount',
 /* Fix (bulk edit): three-step bulk edit modal elements */
 'btnEditSelected','bulkOverlay1','bulkTitle1','bulkHint1','bulkChkName','bulkLblName','bulkInpName',
 'bulkChkLoc','bulkLblLoc','bulkInpLoc','bulkChkAmount','bulkLblAmount','bulkInpAmount',
 'bulkErr1','bulkWarnLoc','bulkCancel1','bulkContinue',
 'bulkOverlay2','bulkTitle2','bulkP2','bulkChangesList','bulkP3','bulkMergeList','bulkErr2','bulkCancel2','bulkApply',
 'bulkOverlay3','bulkTitle3','bulkP4','bulkReportList','bulkClose3'
].forEach(function(id){ el[id] = $(id); });

/* i18n helpers (LANGUAGES, languagesValid, getLang, detectLang, t) are defined near the top */

/* ================= Store (localStorage) ================= */
function persist(){
  if (!storageOk) return true; // in-memory only
  var payload = JSON.stringify({
    version: 2,
    nextDepotId: state.nextDepotId,
    nextItemId: state.nextItemId,
    activeDepotId: state.activeDepotId,
    depots: state.depots
  });
  try {
    localStorage.setItem(LS_DATA, payload);
    try { localStorage.removeItem(LS_LEGACY); } catch(e2){} // migrated away
    return true;
  } catch(e){
    // Quota likely exceeded: evict old snapshots and retry once
    if (evictOldestSnapshot()){
      try { localStorage.setItem(LS_DATA, payload); return true; } catch(e2){}
    }

/* Load multi-depot state; migrates the legacy flat structure once. */
function loadState(){
  // 1) current multi-depot format
  try {
    var raw = localStorage.getItem(LS_DATA);
    if (raw){
      var d = JSON.parse(raw);
      if (d && d.version === 2 && Array.isArray(d.depots)){
        var depots = [], maxDepot = 0, maxItem = 0;
        for (var i = 0; i < d.depots.length; i++){
          var dp = d.depots[i];
          if (!dp || typeof dp.name !== 'string') continue;
          var items = [];
          if (Array.isArray(dp.items)){
            for (var j = 0; j < dp.items.length; j++){
              var it = dp.items[j];
              if (!it || typeof it.name !== 'string') continue;
              var rec = {
                id: (typeof it.id === 'number' && isFinite(it.id)) ? it.id : null,
                name: String(it.name).slice(0, 200),
                location: (typeof it.location === 'string') ? String(it.location).slice(0, 200) : '',
                /* Fix (Phase 4): migrate missing/invalid amount to 1 — silent, no
                   announcements (loadState runs before any UI). Format stays v2:
                   amount is an additive, optional field. */
                amount: (typeof it.amount === 'number' && isFinite(it.amount) && it.amount >= 0 && it.amount % 1 === 0) ? it.amount : 1
              };
              if (rec.id !== null && rec.id > maxItem) maxItem = rec.id;
              items.push(rec);
            }
          }
          var depId = (typeof dp.id === 'number' && isFinite(dp.id)) ? dp.id : null;
          if (depId !== null && depId > maxDepot) maxDepot = depId;
          depots.push({ id: depId, name: String(dp.name).slice(0, 60), items: items });
        }
        var nextItemId = (typeof d.nextItemId === 'number' && d.nextItemId > maxItem) ? d.nextItemId : maxItem + 1;
        depots.forEach(function(dp2){
          if (dp2.id === null) dp2.id = nextItemId++; // degenerate but harmless
          dp2.items.forEach(function(r){ if (r.id === null) r.id = nextItemId++; });
        });
        var active = (typeof d.activeDepotId === 'number' && findDepotIn(depots, d.activeDepotId))
          ? d.activeDepotId : (depots.length ? depots[0].id : null);
        return {
          ok: true,
          data: {
            depots: depots,
            activeDepotId: active,
            nextDepotId: (typeof d.nextDepotId === 'number' && d.nextDepotId > maxDepot) ? d.nextDepotId : maxDepot + 1,
            nextItemId: nextItemId
          }
        };
      }
    }
  } catch(e){ /* fall through to legacy */ }
  // 2) legacy flat structure -> migrate into a single default depot
  try {
    var legacy = localStorage.getItem(LS_LEGACY);
    if (legacy){
      var old = JSON.parse(legacy);
      if (old && Array.isArray(old.items)){
        var items = [], maxId = 0;
        for (var k = 0; k < old.items.length; k++){
          var oit = old.items[k];
          if (!oit || typeof oit.name !== 'string') continue;
          var orec = {
            id: (typeof oit.id === 'number' && isFinite(oit.id)) ? oit.id : null,
            name: String(oit.name).slice(0, 200),
            location: (typeof oit.location === 'string') ? String(oit.location).slice(0, 200) : '',
            amount: 1 // Fix (Phase 4): legacy items had no amount — default silently
          };
          if (orec.id !== null && orec.id > maxId) maxId = orec.id;
          items.push(orec);
        }
        var nextItemId = (typeof old.nextId === 'number' && old.nextId > maxId) ? old.nextId : maxId + 1;
        items.forEach(function(r){ if (r.id === null) r.id = nextItemId++; });
        var depotName = t('defaultDepotName');
        return {
          ok: true,
          migrated: true,
          data: {
            depots: [{ id: 1, name: depotName, items: items }],
            activeDepotId: 1,
            nextDepotId: 2,
            nextItemId: nextItemId
          }
        };
      }
    }
  } catch(e){ /* fall through to fresh */ }
  return { ok: true, empty: true };
}
function findDepotIn(depots, id){
  for (var i = 0; i < depots.length; i++){
    if (depots[i].id === id) return true;
  }
  return false;
}

/* ================= Snapshots (rolling window of 5) ================= */
/* Snapshots are kept in ONE localStorage key as an array, newest first.
   This avoids key collisions when several mutations happen in the same
   millisecond and makes pruning trivial. */
var LS_SNAPS = 'depotCatalog.snaps.v1';
function readSnaps(){
  try {
    var arr = JSON.parse(localStorage.getItem(LS_SNAPS));
    return Array.isArray(arr) ? arr : [];
  } catch(e){ return []; }
}
function writeSnaps(snaps){
  try {
    localStorage.setItem(LS_SNAPS, JSON.stringify(snaps));
    return true;
  } catch(e){ return false; }
}
function snapshotCurrentData(){
  if (!storageOk) return;
  var entry = {
    ts: Date.now(),
    data: {
      version: 2,
      nextDepotId: state.nextDepotId,
      nextItemId: state.nextItemId,
      activeDepotId: state.activeDepotId,
      depots: state.depots
    }
  };
  var snaps = readSnaps();
  snaps.unshift(entry);
  while (snaps.length > MAX_SNAPS) snaps.pop(); // rolling window: keep newest 5
  if (!writeSnaps(snaps)){
    // Quota likely exceeded: drop oldest snapshots and retry
    while (snaps.length > 1){
      snaps.pop();
      if (writeSnaps(snaps)) return;
    }
    showToast(t('storageWarn'), 'warn');
    announce(t('storageWarn'), true);
  }
}
function evictOldestSnapshot(){
  var snaps = readSnaps();
  if (snaps.length === 0) return false;
  snaps.pop();
  return writeSnaps(snaps);
}

function getFilteredItems(){
  var q = state.filter.trim().toLowerCase();
  var list = state.items.slice();
  if (q){
    list = list.filter(function(it){
      return it.name.toLowerCase().indexOf(q) !== -1 ||
             it.location.toLowerCase().indexOf(q) !== -1;
    });
  }
  /* Fix (sortable columns): apply the active sort AFTER filtering (never bypasses
     search), case-insensitive via locale-aware comparison in the current language. */
  if (state.sort.key){
    var k = state.sort.key;
    var m = (state.sort.dir === 'desc') ? -1 : 1;
    list.sort(function(x, y){ return x[k].localeCompare(y[k], state.lang) * m; });
  }
  return list;
}

/* ---------- Pagination controls ---------- */
function hidePagination(){
  el.pagination.classList.add('hidden');
  el.pagination.innerHTML = '';
}
function renderPagination(totalPages){
  var nav = el.pagination;
  nav.innerHTML = '';
  if (totalPages <= 1){ nav.classList.add('hidden'); return; }
  nav.classList.remove('hidden');
  nav.setAttribute('aria-label', t('paginationAria'));

  function mkBtn(label, page, opts){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'page-btn' + (opts && opts.active ? ' active' : '');
    b.innerHTML = label; // trusted static content (translated labels + &#8249;/&#8250;)
    if (opts && opts.active){
      b.setAttribute('aria-current', 'page');
      b.setAttribute('aria-label', t('pageAria', { n: page }));
    } else {
      b.setAttribute('aria-label', t('pageAria', { n: page }));
    }
    if (opts && opts.disabled) b.disabled = true;
    else b.setAttribute('data-page', String(page));
    return b;
  }
  function mkEllipsis(){
    var s = document.createElement('span');
    s.className = 'page-ellipsis';
    s.textContent = '\u2026';
    return s;
  }

  var prev = mkBtn('&#8249; ' + t('prevPage'), state.page - 1, { disabled: state.page === 1 });
  prev.setAttribute('aria-label', t('prevPageAria'));
  nav.appendChild(prev);

  var numbers = [];
  if (totalPages <= 7){
    for (var p = 1; p <= totalPages; p++) numbers.push(p);
  } else {
    numbers.push(1);
    var lo = Math.max(2, state.page - 1);
    var hi = Math.min(totalPages - 1, state.page + 1);
    if (lo > 2) numbers.push(0); // 0 => ellipsis
    for (var q = lo; q <= hi; q++) numbers.push(q);
    if (hi < totalPages - 1) numbers.push(-1); // -1 => ellipsis
    numbers.push(totalPages);
  }
  numbers.forEach(function(p){
    if (p === 0 || p === -1){ nav.appendChild(mkEllipsis()); return; }
    nav.appendChild(mkBtn(String(p), p, { active: p === state.page }));
  });

  var next = mkBtn(t('nextPage') + ' &#8250;', state.page + 1, { disabled: state.page === totalPages });
  next.setAttribute('aria-label', t('nextPageAria'));
  nav.appendChild(next);
}

async function saveInlineEdit(){

    });

/* ================= Manual backup: CSV export / import ================= */
function pad2(n){ return String(n).length < 2 ? '0' + n : String(n); }
function csvEscape(value){
  var v = String(value);
  if (/[",\r\n]/.test(v)){
    return '"' + v.replace(/"/g, '""') + '"';
  }
  return v;
}
function sanitizeFilePart(name){
  var s = String(name || '').replace(/[\\/:*?"<>|]+/g, '-').replace(/\s+/g, ' ').trim();
  return s || 'Depot';
}
function handleExport(){
  var dep = activeDepot();
  if (!dep) return;
  // Warn that only the active depot is exported; the user confirms or cancels
  askConfirm({
    title: t('exportWarnTitle'),
    message: t('exportWarnMsg', { depotName: dep.name }),
    okLabel: t('download')
  }).then(function(yes){
    if (!yes) return;
    var lines = ['Name,Location,Amount']; // Fix (Phase 4): Amount column added
    for (var i = 0; i < dep.items.length; i++){
      lines.push(csvEscape(dep.items[i].name) + ',' + csvEscape(dep.items[i].location) + ',' + String(dep.items[i].amount));
    }
    // BOM so spreadsheet apps detect UTF-8 correctly
    var blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var d = new Date(); // local time
    a.download = 'depotCatalog_' + sanitizeFilePart(dep.name) +
                 '_D' + pad2(d.getDate()) + pad2(d.getMonth() + 1) +
                 String(d.getFullYear()).slice(-2) +
                 '_T' + pad2(d.getHours()) + pad2(d.getMinutes()) + '.csv';
    a.href = url;
    document.body.appendChild(a);
    a.click(); // direct user gesture => works on desktop and mobile
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    showToast(t('exported'), 'success');
    announce(t('exported'));
  });
}
/* RFC-4180-style CSV parser: quoted fields, escaped quotes, CRLF/LF */
function parseCsvRows(text){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1); // strip BOM
  var rows = [], row = [], field = '', inQuotes = false;
  for (var i = 0; i < text.length; i++){
    var c = text.charAt(i);
    if (inQuotes){
      if (c === '"'){
        if (text.charAt(i + 1) === '"'){ field += '"'; i++; }
        else inQuotes = false;
      } else {
        field += c;
      }
    } else if (c === '"'){
      inQuotes = true;
    } else if (c === ','){
      row.push(field); field = '';
    } else if (c === '\n'){
      row.push(field); rows.push(row); row = []; field = '';
    } else if (c === '\r'){
      if (text.charAt(i + 1) === '\n') i++;
      row.push(field); rows.push(row); row = []; field = '';
    } else {
      field += c;
    }
  }
  if (field !== '' || row.length > 0){ row.push(field); rows.push(row); }
  return rows;
}
function analyzeCsvImport(text){
  var rows = parseCsvRows(text);
  if (rows.length === 0) return { error: true };
  var header = rows[0].map(function(s){ return s.trim().toLowerCase(); });
  var nameIdx = header.indexOf('name');
  var locIdx = header.indexOf('location');
  if (nameIdx === -1 || locIdx === -1) return { error: true };
  var amountIdx = header.indexOf('amount'); // Fix (Phase 4): optional Amount column
  // keys of existing items: imported rows matching these are duplicates too
  var existingKeys = {};
  for (var e = 0; e < state.items.length; e++){
    existingKeys[state.items[e].name.toLowerCase() + '||' + state.items[e].location.toLowerCase()] = true;
  }
  var valid = [], dup = [], missing = [], amountDefaulted = 0, noLocation = 0;
  var seen = {};
  for (var r = 1; r < rows.length; r++){
    var cells = rows[r];
    if (cells.length === 1 && cells[0].trim() === '') continue; // blank line
    var rowNum = r + 1; // 1-based, header is row 1
    var name = (nameIdx < cells.length) ? cells[nameIdx].trim().slice(0, 200) : '';
    var location = (locIdx < cells.length) ? cells[locIdx].trim().slice(0, 200) : '';
    if (!name){
      // Fix (Phase 5): only a missing NAME skips a row now — empty location is allowed
      missing.push({ row: rowNum, name: '', location: location, reason: 'name' });
      continue;
    }
    // Fix (Phase 4): optional Amount — present+valid used as-is; empty/invalid/missing
    // column defaults to 1 and is counted for user feedback (valid rows only)
    var am = 1, amDefaulted = false;
    if (amountIdx !== -1){
      var rawA = (amountIdx < cells.length) ? cells[amountIdx].trim() : '';
      if (rawA !== ''){
        var pr = parseAmount(rawA);
        if (pr.ok){ am = pr.value; } else { amDefaulted = true; }
      } else {
        amDefaulted = true;
      }
    } else {
      amDefaulted = true;
    }
    var key = name.toLowerCase() + '||' + location.toLowerCase();
    if (seen[key] || existingKeys[key]){
      dup.push({ row: rowNum, name: name, location: location });
      continue;
    }
    seen[key] = true;
    valid.push({ name: name, location: location, amount: am });
    if (amDefaulted) amountDefaulted++;
    if (!location) noLocation++; // Fix (Phase 5): count imported rows with no location
  }
  return { valid: valid, dup: dup, missing: missing, amountDefaulted: amountDefaulted, noLocation: noLocation };
}
function skippedLine(item, reasonKey, emoji){
  var icon = emoji ? emoji + ' ' : '';
  return icon + t('skippedRow', { n: item.row }) + ': \u201C' + item.name + '\u201D @ \u201C' +
         item.location + '\u201D \u2014 ' + t(reasonKey);
}
function handleImportFile(file){
  if (!file) return;
  if (!activeDepot()) return; // nowhere to import into
  var reader = new FileReader();
  reader.onerror = function(){ showToast(t('invalidFile'), 'error'); announce(t('invalidFile'), true); };
  reader.onload = function(){
    var result = analyzeCsvImport(String(reader.result));
    if (result.error){ showToast(t('csvBadHeader'), 'error'); announce(t('csvBadHeader'), true); return; }
    var skippedCount = result.dup.length + result.missing.length;
    var listItems = [];
    result.dup.forEach(function(d){
      listItems.push(skippedLine(d, 'reasonDup'));
    });
    result.missing.forEach(function(m){
      listItems.push(skippedLine(m, m.reason === 'both' ? 'reasonNoBoth' :
                                     (m.reason === 'name' ? 'reasonNoName' : 'reasonNoLoc')));
    });
    askConfirm({
      title: t('impSumTitle'),
      message: t('impSumValid', { n: result.valid.length }) + '\n' +
               t('impSumDup', { n: result.dup.length }) + '\n' +
               t('impSumMissing', { n: result.missing.length }) +
               (result.noLocation > 0 ? '\n' + t('impSumNoLoc', { n: result.noLocation }) : '') + // Fix (Phase 5): non-blocking no-location warning
               (result.amountDefaulted > 0 ? '\n' + t('impSumAmount', { n: result.amountDefaulted }) : ''), // Fix (Phase 4): amount-defaulted summary line (no emoji in modal)
      list: listItems,
      okLabel: t('impApplyBtn'),
      danger: false
    }).then(function(yes){
      if (!yes) return;
      // APPEND: keep existing items, add the valid rows with new IDs
      var firstNewId = null;
      result.valid.forEach(function(v){
        var id = state.nextItemId++;
        if (firstNewId === null) firstNewId = id;
        state.items.push({ id: id, name: v.name, location: v.location, amount: v.amount }); // Fix (Phase 4): amount imported
      });
      state.editingId = null;
      persist(); snapshotCurrentData();
      // Show the page that contains the first newly added item
      if (firstNewId !== null){
        var fl = getFilteredItems();
        for (var k = 0; k < fl.length; k++){
          if (fl[k].id === firstNewId){ state.page = Math.floor(k / state.pageSize) + 1; break; }
        }
      }
      hideImportReport();
      render();
      if (skippedCount > 0 || result.amountDefaulted > 0 || result.noLocation > 0){ // Fix (Phase 5): notice also for no-location rows
        // Fix (Phase 4): show the notice when rows were skipped OR when Amount was
        // defaulted (e.g., missing Amount column) — spec requires feedback in both cases
        showImportReport(result.valid.length, result.dup, result.missing, result.amountDefaulted, result.noLocation); // Fix (Phase 5): pass no-location count
        showSaveIndicator(); // Fix: data is persisted even when rows were skipped (audit #8)
        // Fix (Phase 4): SR users get the same defaulted-rows feedback as visual users
        announce(t('impComplete', { n: result.valid.length, d: result.dup.length }) +
                 (result.amountDefaulted > 0 ? ' ' + t('impSumAmount', { n: result.amountDefaulted }) : ''), true);
      } else {
        showSaveIndicator();
        showToast(t('imported', { n: result.valid.length }), 'success');
        announce(t('imported', { n: result.valid.length }));
      }
    });
  };
  reader.readAsText(file);
}
function hideImportReport(){
  el.importReport.classList.add('hidden');
}
function showImportReport(validCount, dup, missing, amountDefaulted, noLocation){
  el.impReportTitle.textContent = t('impReportTitle');
  el.impReportSummary.textContent = t('imported', { n: validCount });
  el.impReportList.innerHTML = '';
  function addItem(cls, text){
    var li = document.createElement('li');
    if (cls) li.className = cls;
    li.textContent = text; // textContent => XSS-safe
    el.impReportList.appendChild(li);
  }
  // Grouped sections with clear headers and spacing between them
  if (dup.length){
    addItem('report-header', t('impRepDupHeader', { n: dup.length }));
    dup.forEach(function(d){
      addItem('', skippedLine(d, 'reasonDup', '\u26A0\uFE0F'));
    });
  }
  if (missing.length){
    addItem('report-header', t('impRepMissingHeader', { n: missing.length }));
    missing.forEach(function(m){
      addItem('', skippedLine(m, m.reason === 'both' ? 'reasonNoBoth' :
                                     (m.reason === 'name' ? 'reasonNoName' : 'reasonNoLoc'), '\u274C'));
    });
  }
  if (amountDefaulted > 0){
    // Fix (Phase 4): mention amount-defaulted rows (emoji allowed outside modals)
    addItem('report-header', t('impRepAmountHeader', { n: amountDefaulted }));
  }
  if (noLocation > 0){
    // Fix (Phase 5): non-blocking warning for imported rows without a location
    addItem('report-header', t('impRepNoLocHeader', { n: noLocation }));
  }
  el.importReport.classList.remove('hidden');
}

/* Fix (sortable columns): header state — indicator char, aria-label and aria-sort
   for both sortable headers; the inactive sortable column reports aria-sort "none". */
function updateSortHeaders(){
  var nameInd = '\u2195', locInd = '\u2195', nameSort = 'none', locSort = 'none';
  var nameAria = t('sortAriaUnsorted', { col: t('colName') });
  var locAria = t('sortAriaUnsorted', { col: t('colLoc') });
  if (state.sort.key === 'name'){
    if (state.sort.dir === 'asc'){
      nameInd = '\u2191'; nameSort = 'ascending';
      nameAria = t('sortAriaAsc', { col: t('colName') });
    } else {
      nameInd = '\u2193'; nameSort = 'descending';
      nameAria = t('sortAriaDesc', { col: t('colName') });
    }
  } else if (state.sort.key === 'location'){
    if (state.sort.dir === 'asc'){
      locInd = '\u2191'; locSort = 'ascending';
      locAria = t('sortAriaAsc', { col: t('colLoc') });
    } else {
      locInd = '\u2193'; locSort = 'descending';
      locAria = t('sortAriaDesc', { col: t('colLoc') });
    }
  }
  el.btnSortName.textContent = t('colName') + ' ' + nameInd;
  el.btnSortName.setAttribute('aria-label', nameAria);
  el.colNameHead.setAttribute('aria-sort', nameSort);
  el.btnSortLoc.textContent = t('colLoc') + ' ' + locInd;
  el.btnSortLoc.setAttribute('aria-label', locAria);
  el.colLocHead.setAttribute('aria-sort', locSort);
}
/* Fix (sortable columns): 3-state cycle per header — unsorted -> asc -> desc -> unsorted.
   Resets pagination to page 1; announces the new state via the polite live region. */
function cycleSort(key){
  if (state.sort.key === key){
    if (state.sort.dir === 'asc'){
      state.sort.dir = 'desc';
    } else {
      state.sort.key = null;
      state.sort.dir = null;
    }
  } else {
    state.sort.key = key;
    state.sort.dir = 'asc';
  }
  state.page = 1;         // sort change resets pagination
  state.editingId = null; // the editing row may sit on another page after reordering
  // Fix (sort clears selection): consistent with search/depot/pagination clears;
  // no redundant "selection cleared" announcement — the sort announcement below suffices
  state.selectedIds = {};
  updateSortHeaders();
  renderList();
  if (state.sort.key === null){
    announce(t('sortAnnCleared'));
  } else {
    var col = t(state.sort.key === 'name' ? 'colName' : 'colLoc');
    announce(t(state.sort.dir === 'asc' ? 'sortAnnAsc' : 'sortAnnDesc', { col: col }));
  }
}

/* ================= Batch selection & batch delete ================= */
/* Selection is page-scoped: only ids visible on the current page stay selected. */
function visiblePageItems(){
  var filtered = getFilteredItems();
  if (filtered.length === 0) return [];
  var totalPages = Math.max(1, Math.ceil(filtered.length / state.pageSize));
  var page = Math.min(Math.max(1, state.page), totalPages);
  var startIdx = (page - 1) * state.pageSize;
  return filtered.slice(startIdx, startIdx + state.pageSize);
}
function countSelection(){
  return Object.keys(state.selectedIds).length;
}
/* Prune the selection to the visible page and sync the select-all checkbox +
   Delete-selected button. Runs at the top of renderList, so search, sort,
   pagination, depot switches and page jumps all keep the selection consistent. */
function syncBatchUI(){
  var vis = visiblePageItems();
  var visIds = {};
  for (var i = 0; i < vis.length; i++) visIds[vis[i].id] = true;
  Object.keys(state.selectedIds).forEach(function(id){
    if (!visIds[id]) delete state.selectedIds[id];
  });
  updateSelectAllState(vis);
  updateDeleteSelectedBtn();
}
function updateSelectAllState(vis){
  if (!el.selectAll) return;
  if (!vis) vis = visiblePageItems();
  var selCount = 0;
  for (var i = 0; i < vis.length; i++){ if (state.selectedIds[vis[i].id]) selCount++; }
  el.selectAll.disabled = (vis.length === 0);
  el.selectAll.checked = (vis.length > 0 && selCount === vis.length);
  el.selectAll.indeterminate = (selCount > 0 && selCount < vis.length); // mixed state, exposed to AT via the IDL property
}
function updateDeleteSelectedBtn(){
  /* Fix (bulk edit) + Fix (bulk icons): both batch buttons show the inline
     row-action icon (✏️/🗑️, aria-hidden) plus the live count "(N)" — no words.
     The accessible name is a descriptive aria-label that doubles as the title
     tooltip and updates with the count (also refreshed on language switch via
     render → syncBatchUI). Both are display:none at count 0, so neither is
     tab-reachable — the hidden-state requirement needs no extra code. */
  var n = countSelection();
  if (n > 0){
    el.delSelCount.textContent = String(n);
    el.editSelCount.textContent = String(n);
    var delLbl = t('bulkDeleteSelected', { count: n });
    var editLbl = t('bulkEditSelected', { count: n });
    el.btnDelSelected.setAttribute('aria-label', delLbl);
    el.btnDelSelected.title = delLbl;
    el.btnEditSelected.setAttribute('aria-label', editLbl);
    el.btnEditSelected.title = editLbl;
    el.btnDelSelected.classList.remove('hidden');
    el.btnEditSelected.classList.remove('hidden');
  } else {
    el.btnDelSelected.classList.add('hidden');
    el.btnEditSelected.classList.add('hidden');
  }
}
function toggleSelect(id){
  if (state.selectedIds[id]) delete state.selectedIds[id];
  else state.selectedIds[id] = true;
  updateSelectAllState();
  updateDeleteSelectedBtn();
  var n = countSelection();
  announce(n > 0 ? t('nSelected', { n: n }) : t('selectionCleared'));
}
function toggleSelectAll(){
  var vis = visiblePageItems();
  var allSelected = (vis.length > 0);
  for (var i = 0; i < vis.length; i++){ if (!state.selectedIds[vis[i].id]){ allSelected = false; break; } }
  for (var j = 0; j < vis.length; j++){
    if (allSelected) delete state.selectedIds[vis[j].id];
    else state.selectedIds[vis[j].id] = true;
  }
  // update the visible row checkboxes without a full re-render
  var boxes = el.listBody.querySelectorAll('.row-check');

  announce(n > 0 ? t('nSelected', { n: n }) : t('selectionCleared'));
}
function handleDeleteSelected(){

    title: t('delSelectedTitle'),

/* ================= Bulk edit (Fix: bulk edit) ================= */
/* Three steps: 1) choose fields  2) preview + merge confirmation  3) final report.
   Editing-row policy: a row in inline-edit mode cannot be selected (its checkbox is
   disabled in buildEditRow and startEdit() drops it from the selection), so the bulk
   scope is simply "currently selected ids". The guard in handleEditSelected is
   defensive only — both batch buttons always operate on non-editing rows. */
var bulkPlan = null; // { ids, changes, warnLoc, amountDefaultedCount, preview, merges }

function bulkIsOpen(){
  return !el.bulkOverlay1.classList.contains('hidden') ||
         !el.bulkOverlay2.classList.contains('hidden') ||
         !el.bulkOverlay3.classList.contains('hidden');
}
function bulkToggleInputs(){

  el.bulkInpName.disabled = !el.bulkChkName.checked;

  el.bulkInpAmount.disabled = !el.bulkChkAmount.checked;

function bulkResetFields(){

  el.bulkInpAmount.value = ''; // Amount empty => defaults to 1 at apply (no pre-fill)
  el.bulkErr1.textContent = '';
  el.bulkWarnLoc.classList.add('hidden');
  bulkToggleInputs();
}
function bulkFocusAfterClose(){
  // Trigger hides only once the selection is gone (after apply) => focus search
  if (el.btnEditSelected.classList.contains('hidden')){
    try { el.inpSearch.focus(); } catch(e){}
  } else {
    try { el.btnEditSelected.focus(); } catch(e){} // a11y: focus back to the trigger
  }
}
function handleEditSelected(){
  var dep = activeDepot();
  if (!dep) return;
  var ids = Object.keys(state.selectedIds)
    .map(function(k){ return parseInt(k, 10); })
    .filter(function(id){
      var it = findById(id); // guard: skip vanished rows and the inline-editing row
      return !!it && state.editingId !== id;
    });
  if (ids.length === 0) return;
  bulkPlan = { ids: ids, warnLoc: false, amountDefaultedCount: 0 };

  el.bulkCancel1.textContent = t('cancel');

}
function closeBulk1(){
