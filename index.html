<link rel="icon" type="image/png" href="assets/icon.png">
<!-- Fix (favicon on load): build the active depot's emoji favicon BEFORE first paint,
     so refresh/first load shows it too. dcSetEmojiFavicon is the shared helper the main
     app reuses; everything is try/catch'd so any failure silently leaves icon.png. -->
<script>
(function(){
  function dcSetEmojiFavicon(emoji){
    try {
      var old = document.querySelectorAll('link[rel="icon"]');
      if (!old.length) return false;
      var c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      var ctx = c.getContext('2d');
      if (!ctx) return false; // no canvas => static icon.png stays
      ctx.clearRect(0, 0, 64, 64);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '52px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(emoji, 32, 35);
      var url = c.toDataURL('image/png');
      if (!url || url.indexOf('data:image/png') !== 0) return false;
      // REPLACE the link element(s): mutating href alone is unreliable across browsers
      for (var i = 0; i < old.length; i++){
        if (old[i].parentNode) old[i].parentNode.removeChild(old[i]);
      }
      var nl = document.createElement('link');
      nl.setAttribute('rel', 'icon');
      nl.setAttribute('type', 'image/png');
      nl.setAttribute('href', url);
      document.head.appendChild(nl);
      window.__dcFaviconEmoji = emoji; // last successful draw (shared with the main app)
      return true;
    } catch(e){ return false; }
  }
  window.dcSetEmojiFavicon = dcSetEmojiFavicon;
  try {
    var emoji = '📦'; // fallback
    var raw = localStorage.getItem('depotCatalog.data.v2');
    if (raw){
      var d = JSON.parse(raw);
      if (d && typeof d.activeDepotId === 'number'){
        var icons = (d.depotIcons && typeof d.depotIcons === 'object') ? d.depotIcons : {};
        var v = icons[d.activeDepotId];
        if (typeof v === 'string' && v) emoji = v;
      }
    }
    dcSetEmojiFavicon(emoji);
  } catch(e){ /* static icon.png stays */ }
})();
</script>
<link rel="apple-touch-icon" href="assets/icon.png">
<script>
/* Apply the saved (or system) theme before first paint to avoid a flash */
(function(){
  try {
    var t = null;
    try { t = localStorage.getItem('depotCatalog.theme'); } catch(e){}
    if (t !== 'dark' && t !== 'light'){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>
<script>
/* Fix (settings): apply the saved font/icon scale before first paint (no flash) */
(function(){
  try {
    var MAP = { small:0.9, normal:1, large:1.15, xl:1.3 };
    var f = localStorage.getItem('depotCatalog.fontScale');
    var i = localStorage.getItem('depotCatalog.iconScale');
    if (MAP[f]) document.documentElement.style.setProperty('--app-font-scale', String(MAP[f]));
    if (MAP[i]) document.documentElement.style.setProperty('--app-icon-scale', String(MAP[i]));
  } catch(e){}
})();
</script>

      <div class="check-head" role="columnheader"><input type="checkbox" id="selectAll" aria-label=""></div>
      <div id="colNameHead" role="columnheader" aria-sort="none">
        <button type="button" id="btnSortName" class="sort-btn" aria-label=""></button>
      </div>
      <div id="colLocHead" role="columnheader" aria-sort="none">
        <button type="button" id="btnSortLoc" class="sort-btn" aria-label=""></button>
      </div>
      <!-- Fix (field order): Category column now precedes Amount.
           Category is sortable (same 3-state cycle as Name/Location) -->
      <div id="colCategoryHead" role="columnheader" aria-sort="none">
        <button type="button" id="btnSortCat" class="sort-btn" aria-label=""></button>
      </div>
      <div role="columnheader" id="colAmountHead"><span id="colAmount"></span></div>
      <div role="columnheader"><span></span></div>
    </div>
    <!-- a11y: list semantics (safer than table roles: inline-edit inputs inside rows
         would violate ARIA table structure; visual header stays aria-hidden) -->
    <div id="listBody" role="list"></div>
    <nav id="pagination" class="pagination hidden" aria-label=""></nav>

         when no depot exists. -->

            <option value="20">20</option>

        </span>
      </div>

      </div>
    </div>
  </section>

       Page-size selector and total count moved into the stock list card footer. -->

    <div class="toolbar-row">

        <button type="button" id="btnExport" class="btn btn-secondary"><span class="ico" aria-hidden="true">⬇&nbsp;</span><span id="lblExport"></span></button>
        <!-- Fix (batch select): visible only while rows are selected; .hidden = display:none => not tab-reachable -->
        <!-- Fix (bulk icons): same icons as the inline row actions (✏️/🗑️), emoji is
             aria-hidden; the accessible name comes from aria-label/title (updated live) -->
        <button type="button" id="btnDelSelected" class="btn btn-danger hidden" aria-label="" title=""><span aria-hidden="true">🗑️</span> (<span id="delSelCount"></span>)</button>
        <button type="button" id="btnEditSelected" class="btn btn-secondary hidden" aria-label="" title=""><span aria-hidden="true">✏️</span> (<span id="editSelCount"></span>)</button>
      </div>

    </div>
  </div>

  <!-- Import skipped-rows report (dismissible) -->
  <!-- a11y: inline notice (not a modal — no overlay/interaction blocking), so
       region semantics let SR users find it; summary is announced via live region -->
  <section id="importReport" class="card import-report hidden" role="region" aria-labelledby="impReportTitle">
    <div class="form-head">
      <!-- Fix (Phase 3): real heading — same look (1rem bold; .form-head h2 neutralizes the .card h2 margin) -->
      <h2 id="impReportTitle"></h2>

    </div>

    <ul id="impReportList" class="report-list"></ul>
  </section>

      <h2 id="formTitle" tabindex="-1"></h2>
      <button type="button" id="btnCloseForm" class="icon-btn" aria-label=""><span aria-hidden="true">✕</span></button>
    </div>
    <form id="productForm" novalidate>
      <div class="field">
        <label for="inpName" id="lblName"></label>
        <input type="text" id="inpName" maxlength="120" autocomplete="off" aria-describedby="nameError" aria-invalid="false">
        <p id="nameError" class="err" role="alert"></p>
        <div id="nameSuggest" class="suggest hidden" role="listbox" aria-label=""></div>
      </div>
      <div class="field">
        <label for="inpLoc" id="lblLoc"></label>
        <input type="text" id="inpLoc" maxlength="120" autocomplete="off" aria-describedby="hintAddJump">
        <!-- Fix (hint placement): moved out of this field — it now lives on its own line
             directly above the Import from CSV button (see .import-area below).
             aria-describedby on #inpLoc resolves by id wherever the element sits. -->
      </div>
      <!-- Fix (field order): Category now precedes Amount -> Name, Location, Category, Amount.
           The Category field is a <select>; its first option opens the "new category" modal.
           Empty stays valid — no validation and no reserved error area. -->
      <div class="field">
        <label for="inpCategory" id="lblCategory"></label>
        <select id="inpCategory" class="cat-select" autocomplete="off"></select>
      </div>
      <!-- Fix (Phase 4): Amount field — visible label, number input, inline error linked via aria-describedby -->
      <div class="field">
        <label for="inpAmount" id="lblAmount"></label>
        <input type="number" id="inpAmount" min="0" step="1" value="1" autocomplete="off" aria-describedby="amountError" aria-invalid="false">
        <p id="amountError" class="err" role="alert"></p>
      </div>
      <div class="form-actions field">
        <button type="submit" id="btnSubmit" class="btn btn-primary"></button>
      </div>
    </form>
    <div class="import-area">
      <!-- Fix (hint placement): the Enter-key tip gets its own full-width line directly above
           the Import button instead of sitting under the narrow Location input, where it
           wrapped and crowded this area. Keeps .hint-inline (muted, small) styling. -->

      <button type="button" id="btnImportTrigger" class="btn btn-secondary"><span class="ico" aria-hidden="true">⬆&nbsp;</span><span id="lblImport"></span></button>
      <!-- Fix (Phase 3): sr-only label for the CSV file input (spec §1) -->
      <label for="inpImport" id="lblImportFile" class="sr-only"></label>
      <input type="file" id="inpImport" accept=".csv,text/csv" class="sr-only" tabindex="-1"> <!-- Fix (a11y audit C2): .sr-only + focusable landed focus on an invisible control; the visible Import button triggers it -->
    </div>
  </section>

      <span class="copyright">2026 sekodev</span>

</div><!-- /.wrap -->

<script>
/* Bootstrap guard (dependency-free). If any application script failed to load,
   say so instead of leaving a silently broken page: an inline classic script
   always runs, even when an earlier <script src> 404s. The list of names to
   verify lives in namespace.js (DC.expected) — deliberately not duplicated here. */
(function () {
  var EN = 'Application scripts failed to load. Please refresh or re-download the app.';
  var TR = 'Uygulama betikleri yüklenemedi. Lütfen yenileyin veya uygulamayı yeniden indirin.';
  var ok = false;
  try {
    var d = window.DC;
    ok = !!(d && d.app && d.expected && d.expected.length);
    if (ok) {
      for (var i = 0; i < d.expected.length; i++) {
        if (!d[d.expected[i]]) { ok = false; break; }
      }
    }
  } catch (e) { ok = false; }
  if (ok) return;
  /* Language: saved preference first, then the device, then English — the same
     precedence the app uses (key: depotCatalog.lang). */
  var lang = null;
  try { lang = localStorage.getItem('depotCatalog.lang'); } catch (e2) {}
  if (lang !== 'tr' && lang !== 'en') {
    var nav = navigator.language || (navigator.languages && navigator.languages[0]) || '';
    lang = String(nav).toLowerCase().indexOf('tr') === 0 ? 'tr' : 'en';
  }
  try {
    var root = document.getElementById('appRoot');
    var banner = document.getElementById('bootstrapError');
    if (root) root.classList.add('hidden');
    if (banner) {
      banner.textContent = (lang === 'tr') ? TR : EN;
      banner.classList.remove('hidden');
    }
  } catch (e3) {}
})();
</script>
