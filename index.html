<!-- Fix (favicon on load): build the active depot's emoji favicon BEFORE first paint,
     so refresh/first load shows it too. dcSetEmojiFavicon is the shared helper the main
     app reuses; everything is try/catch'd so any failure silently leaves icon.png. -->
<script>
(function(){
  function dcSetEmojiFavicon(emoji){
    try {
      var old = document.querySelectorAll('link[rel="icon"]');
      if (!old.length) return false;
      var c = document.createElement('canvas');
      c.width = 64; c.height = 64;
      var ctx = c.getContext('2d');
      if (!ctx) return false; // no canvas => static icon.png stays
      ctx.clearRect(0, 0, 64, 64);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '52px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
      ctx.fillText(emoji, 32, 35);
      var url = c.toDataURL('image/png');
      if (!url || url.indexOf('data:image/png') !== 0) return false;
      // REPLACE the link element(s): mutating href alone is unreliable across browsers
      for (var i = 0; i < old.length; i++){
        if (old[i].parentNode) old[i].parentNode.removeChild(old[i]);
      }
      var nl = document.createElement('link');
      nl.setAttribute('rel', 'icon');
      nl.setAttribute('type', 'image/png');
      nl.setAttribute('href', url);
      document.head.appendChild(nl);
      window.__dcFaviconEmoji = emoji; // last successful draw (shared with the main app)
      return true;
    } catch(e){ return false; }
  }
  window.dcSetEmojiFavicon = dcSetEmojiFavicon;
  try {
    var emoji = '📦'; // fallback
    var raw = localStorage.getItem('depotCatalog.data.v2');
    if (raw){
      var d = JSON.parse(raw);
      if (d && typeof d.activeDepotId === 'number'){
        var icons = (d.depotIcons && typeof d.depotIcons === 'object') ? d.depotIcons : {};
        var v = icons[d.activeDepotId];
        if (typeof v === 'string' && v) emoji = v;
      }
    }
    dcSetEmojiFavicon(emoji);
  } catch(e){ /* static icon.png stays */ }
})();
</script>
<link rel="apple-touch-icon" href="icon.png">
<script>
/* Apply the saved (or system) theme before first paint to avoid a flash */
(function(){
  try {
    var t = null;
    try { t = localStorage.getItem('depotCatalog.theme'); } catch(e){}
    if (t !== 'dark' && t !== 'light'){
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  } catch(e){}
})();
</script>
<script>
/* Fix (settings): apply the saved font/icon scale before first paint (no flash) */
(function(){
  try {
    var MAP = { small:0.9, normal:1, large:1.15, xl:1.3 };
    var f = localStorage.getItem('depotCatalog.fontScale');
    var i = localStorage.getItem('depotCatalog.iconScale');
    if (MAP[f]) document.documentElement.style.setProperty('--app-font-scale', String(MAP[f]));
    if (MAP[i]) document.documentElement.style.setProperty('--app-icon-scale', String(MAP[i]));
  } catch(e){}
})();
</script>

(function(){
'use strict';

/* Aliases to the modules loaded above (read once, at load time). */
var LS_FONT = DC.const.LS_FONT;
var LS_ICON = DC.const.LS_ICON;

function countSelection(){
  return Object.keys(state.selectedIds).length;
}
/* Prune the selection to the visible page and sync the select-all checkbox +
   Delete-selected button. Runs at the top of renderList, so search, sort,
   pagination, depot switches and page jumps all keep the selection consistent. */
function syncBatchUI(){
  var vis = visiblePageItems();
  var visIds = {};
  for (var i = 0; i < vis.length; i++) visIds[vis[i].id] = true;
  Object.keys(state.selectedIds).forEach(function(id){
    if (!visIds[id]) delete state.selectedIds[id];
  });
  updateSelectAllState(vis);
  updateDeleteSelectedBtn();
}
function updateSelectAllState(vis){
  if (!el.selectAll) return;
  if (!vis) vis = visiblePageItems();
  var selCount = 0;
  for (var i = 0; i < vis.length; i++){ if (state.selectedIds[vis[i].id]) selCount++; }
  el.selectAll.disabled = (vis.length === 0);
  el.selectAll.checked = (vis.length > 0 && selCount === vis.length);
  el.selectAll.indeterminate = (selCount > 0 && selCount < vis.length); // mixed state, exposed to AT via the IDL property
}
function updateDeleteSelectedBtn(){
  /* Fix (bulk edit) + Fix (bulk icons): both batch buttons show the inline
     row-action icon (✏️/🗑️, aria-hidden) plus the live count "(N)" — no words.
     The accessible name is a descriptive aria-label that doubles as the title
     tooltip and updates with the count (also refreshed on language switch via
     render → syncBatchUI). Both are display:none at count 0, so neither is
     tab-reachable — the hidden-state requirement needs no extra code. */
  var n = countSelection();
  if (n > 0){
    el.delSelCount.textContent = String(n);
    el.editSelCount.textContent = String(n);
    var delLbl = t('bulkDeleteSelected', { count: n });
    var editLbl = t('bulkEditSelected', { count: n });
    el.btnDelSelected.setAttribute('aria-label', delLbl);
    el.btnDelSelected.title = delLbl;
    el.btnEditSelected.setAttribute('aria-label', editLbl);
    el.btnEditSelected.title = editLbl;
    el.btnDelSelected.classList.remove('hidden');
    el.btnEditSelected.classList.remove('hidden');
  } else {
    el.btnDelSelected.classList.add('hidden');
    el.btnEditSelected.classList.add('hidden');
  }
}
function toggleSelect(id){
  if (state.selectedIds[id]) delete state.selectedIds[id];
  else state.selectedIds[id] = true;
  updateSelectAllState();
  updateDeleteSelectedBtn();
  var n = countSelection();
  announce(n > 0 ? t('nSelected', { n: n }) : t('selectionCleared'));
}
function toggleSelectAll(){
  var vis = visiblePageItems();
  var allSelected = (vis.length > 0);
  for (var i = 0; i < vis.length; i++){ if (!state.selectedIds[vis[i].id]){ allSelected = false; break; } }
  for (var j = 0; j < vis.length; j++){
    if (allSelected) delete state.selectedIds[vis[j].id];
    else state.selectedIds[vis[j].id] = true;
  }
  // update the visible row checkboxes without a full re-render
  var boxes = el.listBody.querySelectorAll('.row-check');
  for (var k = 0; k < boxes.length; k++){
    boxes[k].checked = !!state.selectedIds[boxes[k].getAttribute('data-id')];
  }
  updateSelectAllState(vis);
  updateDeleteSelectedBtn();
  var n = countSelection();
  announce(n > 0 ? t('nSelected', { n: n }) : t('selectionCleared'));
}
function handleDeleteSelected(){
  var n = countSelection();
  if (n === 0) return;
  askConfirm({
    title: t('delSelectedTitle'),
    message: t('delSelectedMsg', { n: n }),
    okLabel: t('del'),
    danger: true
  }).then(function(yes){
    if (!yes) return;
    var dep = activeDepot();
    if (!dep) return;
    var sel = state.selectedIds;
    dep.items = dep.items.filter(function(it){ return !sel[it.id]; });
    syncItemsRef();
    state.selectedIds = {};
    persist(); snapshotCurrentData(); // auto-backup snapshot
    render();                          // renderList self-heals the page number
    showSaveIndicator();
    showToast(t('nDeleted', { n: n }), 'success');
    announce(t('nDeleted', { n: n }));
    // a11y: the trigger button hides once the selection is gone — move focus to search
    if (el.btnDelSelected.classList.contains('hidden')){ try { el.inpSearch.focus(); } catch(e){} }
  });
}

/* ================= Bulk edit (Fix: bulk edit) ================= */
/* Three steps: 1) choose fields  2) preview + merge confirmation  3) final report.
   Editing-row policy: a row in inline-edit mode cannot be selected (its checkbox is
   disabled in buildEditRow and startEdit() drops it from the selection), so the bulk
   scope is simply "currently selected ids". The guard in handleEditSelected is
   defensive only — both batch buttons always operate on non-editing rows. */
var bulkPlan = null; // { ids, changes, warnLoc, warnCat, amountDefaultedCount, preview, merges }

function bulkIsOpen(){
  return !el.bulkOverlay1.classList.contains('hidden') ||
         !el.bulkOverlay2.classList.contains('hidden') ||

}
function bulkToggleInputs(){

  el.bulkInpName.disabled = !el.bulkChkName.checked;
  el.bulkInpLoc.disabled = !el.bulkChkLoc.checked;
  el.bulkInpAmount.disabled = !el.bulkChkAmount.checked;
  el.bulkInpCategory.disabled = !el.bulkChkCategory.checked; // Fix (category)
}
function bulkResetFields(){
  el.bulkChkName.checked = false;
  el.bulkChkLoc.checked = false;
  el.bulkChkAmount.checked = false;
  el.bulkChkCategory.checked = false; // Fix (category)
  el.bulkInpName.value = '';
  el.bulkInpLoc.value = '';
  el.bulkInpAmount.value = ''; // Amount empty => defaults to 1 at apply (no pre-fill)
  fillCategorySelect(el.bulkInpCategory, ''); // Fix (category dropdown): "Add new category" => clears the category for selected items
  el.bulkErr1.textContent = '';
  el.bulkWarnLoc.classList.add('hidden');
  el.bulkWarnCat.classList.add('hidden'); // Fix (category)
  /* Fix (a11y audit C1): a freshly opened dialog has no invalid fields */
  setInvalid(el.bulkInpName, false);
  setInvalid(el.bulkInpLoc, false);
  setInvalid(el.bulkInpAmount, false);
  setInvalid(el.bulkInpCategory, false);
  bulkToggleInputs();
}
function bulkFocusAfterClose(){
  // Trigger hides only once the selection is gone (after apply) => focus search
  if (el.btnEditSelected.classList.contains('hidden')){
    try { el.inpSearch.focus(); } catch(e){}
  } else {
    try { el.btnEditSelected.focus(); } catch(e){} // a11y: focus back to the trigger
  }
}
function handleEditSelected(){

  if (!dep) return;
  var ids = Object.keys(state.selectedIds)
    .map(function(k){ return parseInt(k, 10); })
    .filter(function(id){
      var it = findById(id); // guard: skip vanished rows and the inline-editing row
      return !!it && state.editingId !== id;

}
function closeBulk1(){
  el.bulkOverlay1.classList.add('hidden');
  bulkPlan = null;
  bulkFocusAfterClose();
}
function handleBulkContinue(){
  var anyChecked = el.bulkChkName.checked || el.bulkChkLoc.checked || el.bulkChkAmount.checked ||
                   el.bulkChkCategory.checked; // Fix (category)
  el.bulkErr1.textContent = '';
  el.bulkWarnLoc.classList.add('hidden');
  el.bulkWarnCat.classList.add('hidden'); // Fix (category)
  setInvalid(el.bulkInpName, false);   // Fix (a11y audit C1): re-validate from a clean state
  setInvalid(el.bulkInpAmount, false);
  if (!anyChecked){
    el.bulkErr1.textContent = t('bulkErrNoField'); // role=alert announces it
    el.bulkChkName.focus();
    return;
  }
  var changes = { name: false, location: false, amount: false, category: false }; // Fix (category)
  var warnLoc = false, amountDefaulted = 0, warnCat = false; // Fix (category)
  if (el.bulkChkName.checked){
    var nm = el.bulkInpName.value.trim();
    if (!nm){
      el.bulkErr1.textContent = t('bulkErrName');
      setInvalid(el.bulkInpName, true); // Fix (a11y audit C1)
      el.bulkInpName.focus();
      return;
    }
    changes.name = nm;
    setInvalid(el.bulkInpName, false); // Fix (a11y audit C1)
  }
  if (el.bulkChkLoc.checked){
    changes.location = el.bulkInpLoc.value.trim();
    if (changes.location === ''){ // empty location is a valid state — warn but allow
      warnLoc = true;
      el.bulkWarnLoc.textContent = t('bulkWarnLocClear');
      el.bulkWarnLoc.classList.remove('hidden');
    }
  }
  if (el.bulkChkAmount.checked){
    if (String(el.bulkInpAmount.value).trim() === ''){
      changes.amount = 1; // empty Amount => default 1
      amountDefaulted = bulkPlan.ids.length;
    } else {
      var a = parseAmount(el.bulkInpAmount.value); // shared digits-only validation
      if (!a.ok || a.value < 0){
        el.bulkErr1.textContent = t('amountInvalid');
        setInvalid(el.bulkInpAmount, true); // Fix (a11y audit C1)
        el.bulkInpAmount.focus();
        return;
      }
      changes.amount = a.value;
      setInvalid(el.bulkInpAmount, false); // Fix (a11y audit C1)
    }
  }
  if (el.bulkChkCategory.checked){ // Fix (category): free text — empty means "clear it"
    changes.category = el.bulkInpCategory.value.trim();
    if (changes.category === ''){ // empty category is a valid state — warn but allow (mirrors Location)
      warnCat = true;
      el.bulkWarnCat.textContent = t('bulkWarnCatClear');
      el.bulkWarnCat.classList.remove('hidden');
    }
  }
  bulkPlan.changes = changes;
  bulkPlan.warnLoc = warnLoc;
  bulkPlan.warnCat = warnCat; // Fix (category)
  bulkPlan.amountDefaultedCount = amountDefaulted;
  bulkPlan.preview = bulkBuildPlan(bulkPlan.ids, changes);
  openBulkPreview();
}

function bulkNormalize(v){ return String(v || '').trim().toLowerCase(); }
function bulkBuildPlan(ids, changes){
  /* Per-item change lines for step 2. Format follows the spec:
     "Name (old) at Location (old) → Name (new) at Location (new)" — full item
     labels on both sides whenever name or location changes; Amount-only changes
     use the compact "(Amount: a → b)" form. */
  var lines = [];
  var catChangedN = 0; // Fix (category): items whose category actually changes
  ids.forEach(function(id){
    var it = findById(id);
    if (!it) return;
    var newName = (changes.name !== false) ? changes.name : it.name;
    var newLoc = (changes.location !== false) ? changes.location : it.location;
    var newAmt = (changes.amount !== false) ? changes.amount : it.amount;
    var nameChanged = newName !== it.name;
    var locChanged = newLoc !== it.location;
    var amtChanged = newAmt !== it.amount;
    var newCat = (changes.category !== false) ? changes.category : it.category; // Fix (category)
    var catChanged = newCat !== it.category; // Fix (category)
    if (catChanged) catChangedN++; // Fix (category)
    if (nameChanged || locChanged){
      lines.push(t('bulkItemAt', { name: it.name, location: it.location || '-' }) +
                 ' \u2192 ' + t('bulkItemAt', { name: newName, location: newLoc || '-' }));
    } else if (amtChanged){
      lines.push(t('bulkAmtChange', { name: it.name, location: it.location || '-', a: it.amount, b: newAmt }));
    }
    if (catChanged){ // Fix (category): "-" when the category is being cleared
      lines.push(t('bulkCatChange', { name: it.name, location: it.location || '-', c: newCat || '-' }));
    }
    // no line when nothing changes for this item
  });
  return { lines: lines, catChangedCount: catChangedN };
}
function bulkComputeMerges(ids, changes){
  /* Simulate the post-edit depot (edited + untouched items) and group by
     normalized name+location. Returns one entry per duplicate group:
     { total, members:[{name,location,amount}], removedN } (kept id = lowest). */
  var dep = activeDepot();
  if (!dep) return [];
  var sim = dep.items.map(function(it){
    var selected = (ids.indexOf(it.id) !== -1);
    return {
      id: it.id,
      name: (selected && changes.name !== false) ? changes.name : it.name,
      location: (selected && changes.location !== false) ? changes.location : it.location,
      amount: (selected && changes.amount !== false) ? changes.amount : it.amount
    };
  });
  var groups = {};
  sim.forEach(function(it){
    var key = bulkNormalize(it.name) + '\u0000' + bulkNormalize(it.location);
    if (!groups[key]) groups[key] = [];
    groups[key].push(it);
  });
  var merges = [];
  Object.keys(groups).forEach(function(key){
    var g = groups[key];
    if (g.length < 2) return;
    g.sort(function(a, b){ return a.id - b.id; }); // lowest id kept (deterministic)
    var total = 0;
    g.forEach(function(m){ total += m.amount; });
    merges.push({
      total: total,
      members: g.map(function(m){ return { name: m.name, location: m.location, amount: m.amount }; }),
      removedN: g.length - 1
    });
  });
  return merges;
}
function openBulkPreview(){
  var plan = bulkPlan.preview;
  el.bulkTitle2.textContent = t('bulkConfirmTitle');
  el.bulkP2.textContent = t('bulkPreviewList');
  el.bulkChangesList.innerHTML = '';
  plan.lines.forEach(function(line){
    var li = document.createElement('li');
    li.textContent = line; // textContent => XSS-safe
    el.bulkChangesList.appendChild(li);
  });
  el.bulkChangesList.classList.toggle('hidden', plan.lines.length === 0);
  // Merge preview — computed and shown BEFORE anything is applied
  var merges = bulkComputeMerges(bulkPlan.ids, bulkPlan.changes);
  bulkPlan.merges = merges;
  el.bulkMergeList.innerHTML = '';
  if (merges.length){
    var totalMembers = 0;
    el.bulkP3.textContent = t('bulkMergeIntro');
    el.bulkP3.classList.remove('hidden');
    merges.forEach(function(m){
      totalMembers += m.members.length;
      var amounts = m.members.map(function(x){ return x.amount; }).join(' + ');
      var li = document.createElement('li');
      li.textContent = t('bulkMergeGroupLine', {
        name: m.members[0].name, location: m.members[0].location || '-',
        n: m.members.length, amounts: amounts, total: m.total
      });
      el.bulkMergeList.appendChild(li);
    });
    var li2 = document.createElement('li');
    li2.textContent = t('bulkMergeCount', { n: totalMembers, m: merges.length });
    el.bulkMergeList.appendChild(li2);
  } else {
    el.bulkP3.classList.add('hidden');
  }
  el.bulkErr2.textContent = '';
  el.bulkCancel2.textContent = t('cancel');
  el.bulkApply.textContent = t('bulkApplyBtn');
  el.bulkOverlay1.classList.add('hidden');
  el.bulkOverlay2.classList.remove('hidden');
  el.bulkCancel2.focus(); // a11y: focus moves to the first focusable element of step 2
}
function closeBulk2(){
  // Spec choice: cancel in step 2 closes BOTH modals (simpler than going back)
  el.bulkOverlay2.classList.add('hidden');
  bulkPlan = null;
  bulkFocusAfterClose();
}

function mergeDuplicates(){
  /* Scan the WHOLE active depot (edited + untouched items) after the field changes
     and merge every group sharing a normalized name+location: lowest id is kept,
     amounts are summed, the rest are removed. Returns { mergedN, removedN, results }. */
  var dep = activeDepot();
  if (!dep) return { mergedN: 0, removedN: 0, results: [] };
  var groups = {};
  dep.items.forEach(function(it){
    var key = bulkNormalize(it.name) + '\u0000' + bulkNormalize(it.location);
    if (!groups[key]) groups[key] = [];
    groups[key].push(it);
  });
  var removeIds = {}, mergedN = 0, removedN = 0, results = [];
  Object.keys(groups).forEach(function(key){
    var g = groups[key];
    if (g.length < 2) return;
    g.sort(function(a, b){ return a.id - b.id; }); // lowest id kept (deterministic)
    var total = 0;
    g.forEach(function(m){ total += m.amount; });
    g[0].amount = total; // mutate the keeper object directly — it stays in dep.items
    for (var j = 1; j < g.length; j++) removeIds[g[j].id] = true;
    removedN += g.length - 1;
    mergedN += g.length;
    results.push({ name: g[0].name, location: g[0].location, total: total });
  });
  if (removedN === 0) return { mergedN: 0, removedN: 0, results: [] };
  dep.items = dep.items.filter(function(it){ return !removeIds[it.id]; });
  return { mergedN: mergedN, removedN: removedN, results: results };
}
function handleBulkApply(){
  var plan = bulkPlan;
  var dep = activeDepot();
  if (!plan || !dep){ closeBulk2(); return; }
  var ids = plan.ids, changes = plan.changes;
  var catChangedN = 0; // Fix (category): items that actually received a different category
  // 1) apply the confirmed field changes
  dep.items.forEach(function(it){
    if (ids.indexOf(it.id) === -1) return;
    if (changes.name !== false) it.name = changes.name;
    if (changes.location !== false) it.location = changes.location;
    if (changes.amount !== false) it.amount = changes.amount;
    if (changes.category !== false){ // Fix (category)
      if (it.category !== changes.category) catChangedN++;
      it.category = changes.category;
    }
  });
  // 2) merge duplicates created by the edit (whole-depot scan, mirrors the preview)
  var mergeRes = mergeDuplicates();
  // nextItemId: removed ids are never reused — only guarantee it stays above the max id
  if (mergeRes.removedN > 0){
    var maxId = dep.items.reduce(function(mx, it){ return Math.max(mx, it.id); }, 0);
    if (state.nextItemId <= maxId) state.nextItemId = maxId + 1;
  }
  if (state.editingId !== null && !findById(state.editingId)) state.editingId = null; // merged away
  syncItemsRef();
  state.selectedIds = {}; // selection cleared after apply
  state.page = 1;          // pagination reset to page 1
  bulkPlan = null;
  persist();
  snapshotCurrentData();   // auto-backup snapshot
  render();                // renderList self-heals the page number
  showSaveIndicator();
  var updatedN = ids.length;
  // polite announcement; merged part skipped when nothing was merged
  announce(mergeRes.removedN > 0
    ? t('bulkAnnounce', { n: updatedN, m: mergeRes.removedN })
    : t('bulkResultUpdated', { n: updatedN }));
  // 3) final report modal
  el.bulkOverlay2.classList.add('hidden');
  el.bulkTitle3.textContent = t('bulkResultTitle');
  el.bulkP4.textContent = t('bulkResultUpdated', { n: updatedN });
  el.bulkReportList.innerHTML = '';
  if (mergeRes.removedN > 0){
    var li = document.createElement('li');
    li.textContent = t('bulkResultMerged', { m: mergeRes.mergedN, k: mergeRes.mergedN - mergeRes.removedN });
    el.bulkReportList.appendChild(li);
    mergeRes.results.forEach(function(r){
      var li2 = document.createElement('li');
      li2.textContent = t('bulkItemAt', { name: r.name, location: r.location || '-' }) + ': ' + r.total;
      el.bulkReportList.appendChild(li2);
    });
    el.bulkReportList.classList.remove('hidden');
  } else {
    el.bulkReportList.classList.add('hidden');
  }
  if (plan.amountDefaultedCount > 0){
    var li3 = document.createElement('li');
    li3.textContent = t('bulkResultAmountNote', { x: plan.amountDefaultedCount });
    el.bulkReportList.appendChild(li3);
    el.bulkReportList.classList.remove('hidden');
  }
  if (catChangedN > 0){ // Fix (category): summarize the applied category changes
    var liCat = document.createElement('li');
    liCat.textContent = t('bulkResultCatNote', { n: catChangedN });
    el.bulkReportList.appendChild(liCat);
    el.bulkReportList.classList.remove('hidden');
  }
  el.bulkClose3.textContent = t('close');
  el.bulkOverlay3.classList.remove('hidden');
  el.bulkClose3.focus(); // a11y: focus moves to the Close button
}
function closeBulk3(){
  el.bulkOverlay3.classList.add('hidden');
  bulkPlan = null; // closing the report does NOT restore the selection (already cleared)
  bulkFocusAfterClose();
}
function bulkTabTrap(ev){
  // Focus trap: Tab cycles within the visible bulk overlay (mirrors #overlay, audit #3)
  var overlay = !el.bulkOverlay1.classList.contains('hidden') ? el.bulkOverlay1 :
                (!el.bulkOverlay2.classList.contains('hidden') ? el.bulkOverlay2 :
                (!el.bulkOverlay3.classList.contains('hidden') ? el.bulkOverlay3 : null));
  if (!overlay) return;
  if (ev.key !== 'Tab') return;
  var focusables = overlay.querySelectorAll('button:not([disabled]):not(.hidden),input:not([disabled]):not(.hidden)');
  if (!focusables.length) return;
  var first = focusables[0], last = focusables[focusables.length - 1];
  if (ev.shiftKey){
    if (document.activeElement === first || document.activeElement === overlay){
      ev.preventDefault(); last.focus();
    }
  } else {
    if (document.activeElement === last){
      ev.preventDefault(); first.focus();
    }
  }
}

/* ================= Event wiring & init ================= */
function bindEvents(){
  el.productForm.addEventListener('submit', handleFormSubmit);
  el.btnToggleAdd.addEventListener('click', function(){
    el.formCard.classList.remove('hidden');
    el.btnToggleAdd.classList.add('invisible'); // hide but keep space => no layout shift
    el.btnToggleAdd.setAttribute('aria-expanded', 'true'); // a11y: reflect open state
    resetForm();
    el.inpName.focus();
  });
  el.btnCloseForm.addEventListener('click', function(){
    el.formCard.classList.add('hidden');
    el.btnToggleAdd.classList.remove('invisible');
    el.btnToggleAdd.setAttribute('aria-expanded', 'false'); // a11y: reflect closed state
    resetForm();
    el.btnToggleAdd.focus();
  });
  el.selPageSize.addEventListener('change', function(){
    var n = parseInt(el.selPageSize.value, 10);
    if (isNaN(n) || n < 1) return;
    state.pageSize = n;
    state.page = 1;       // page size changed => back to first page
    state.editingId = null; // editing row may not exist on the new page
    renderList();
    announce(t('itemsPerPageChanged', { n: n }));
  });
  el.inpName.addEventListener('input', handleNameInput);
  el.inpAmount.addEventListener('input', function(){ setInvalid(el.inpAmount, false); }); // Fix (a11y audit C1): typing clears
  el.inpName.addEventListener('blur', function(){ setTimeout(hideSuggestions, 120); });
  el.inpName.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.isComposing){
      // Enter in the name field navigates to Location instead of submitting
      ev.preventDefault();
      hideSuggestions();
      el.inpLoc.focus();
      return;
    }
    if (ev.key === 'Escape') hideSuggestions();
  });
  el.inpLoc.addEventListener('input', handleLocationInput);
  /* Fix (category dropdown): Category is a <select> now — the old free-text auto-capitalize
     listener is gone (a select's .value is an option value, never a typed string). The
     first-letter rule now lives on the "new category" modal input instead. */
  setupCategorySelect(el.inpCategory);
  /* Fix (field order): keyboard flow is now Name -> Location -> Category -> Amount -> submit
     (audit #10 hardening carried forward: Enter never submits before the last field). */
  el.inpLoc.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.isComposing){
      ev.preventDefault();
      el.inpCategory.focus(); // Location -> Category
    }
  });
  el.inpCategory.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.isComposing){
      ev.preventDefault();
      if (catModalIsOpen()) return; // the "new category" modal owns Enter while it is open
      el.inpAmount.focus(); // Category -> Amount
    }
  });
  el.inpAmount.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.isComposing){
      ev.preventDefault();
      el.btnSubmit.click(); // Amount is last -> Enter submits the form
    }
  });
  document.addEventListener('compositionstart', function(){ DC.input.composing = true; });
  document.addEventListener('compositionend', function(){ DC.input.composing = false; });
  el.inpSearch.addEventListener('input', function(){
    state.filter = el.inpSearch.value;
    state.page = 1;         // filter changed => back to first page
    state.editingId = null; // editing row may be filtered out
    if (countSelection() > 0){ state.selectedIds = {}; announce(t('selectionCleared')); } // Fix (batch select): filter change clears selection (announced once, not per keystroke)
    el.btnClearSearch.classList.toggle('hidden', el.inpSearch.value.length === 0);
    renderList();
    var shown = state.filter.trim() ? getFilteredItems().length : state.items.length;
    el.itemCount.textContent = t('itemCount', { n: shown });
    // Debounced screen reader announcement of search result count
    clearTimeout(el.inpSearch._announceTimer);
    el.inpSearch._announceTimer = setTimeout(function(){
      if (state.filter.trim()){
        if (shown === 0) announce(t('resultsNone'));
        else announce(t('resultsFound', { n: shown }));
      }
    }, 400);
  });
  el.btnClearSearch.addEventListener('click', function(){
    el.inpSearch.value = '';
    state.filter = '';
    state.page = 1;
    state.editingId = null;
    if (countSelection() > 0){ state.selectedIds = {}; announce(t('selectionCleared')); } // Fix (batch select)
    el.btnClearSearch.classList.add('hidden');
    renderList();
    el.itemCount.textContent = t('itemCount', { n: state.items.length });
    el.inpSearch.focus();
  });
  el.btnReportClose.addEventListener('click', hideImportReport);
  el.btnTheme.addEventListener('click', function(){
    toggleTheme();
    applyStaticText(); // refresh aria-checked + labels
  });
  el.btnShortcuts.addEventListener('click', openShortcuts);
  el.ksClose.addEventListener('click', closeShortcuts);
  el.ksOverlay.addEventListener('click', function(ev){
    if (ev.target === el.ksOverlay) closeShortcuts();
  });
  // Fix: Tab focus trap for the cheat-sheet modal, mirroring #overlay (audit #3)
  el.ksOverlay.addEventListener('keydown', function(ev){
    if (ev.key !== 'Tab') return;
    var focusables = el.ksOverlay.querySelectorAll('button:not([disabled]):not(.hidden)');
    if (!focusables.length) return;
    var first = focusables[0];
    var last = focusables[focusables.length - 1];
    if (ev.shiftKey){
      if (document.activeElement === first || document.activeElement === el.ksOverlay){
        ev.preventDefault(); last.focus();
      }
    } else {
      if (document.activeElement === last){
        ev.preventDefault(); first.focus();
      }
    }
  });
  document.addEventListener('keydown', function(ev){
    // "?" opens the cheat sheet (not when typing in inputs/textarea)
    if (ev.key === '?' && !ev.isComposing){
      var tag = document.activeElement && document.activeElement.tagName;
      if (tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'SELECT'){
        ev.preventDefault();
        openShortcuts();
      }
    }
  });
  el.pagination.addEventListener('click', function(ev){
    var b = ev.target && ev.target.closest ? ev.target.closest('.page-btn') : null;
    if (!b || b.disabled) return;
    var p = parseInt(b.getAttribute('data-page'), 10);
    if (!isNaN(p)){
      state.page = p;
      state.editingId = null; // editing row is on another page
      state.selectedIds = {}; // Fix (batch select): pagination change clears selection
      renderList();
      announce(t('pageOf', { p: p, t: Math.max(1, Math.ceil(getFilteredItems().length / state.pageSize)) }));
    }
  });
  el.btnSortName.addEventListener('click', function(){ cycleSort('name'); });
  el.btnSortLoc.addEventListener('click', function(){ cycleSort('location'); });
  el.btnSortCat.addEventListener('click', function(){ cycleSort('category'); }); // Fix (category)
  el.selectAll.addEventListener('change', toggleSelectAll); // Fix (batch select)
  el.btnDelSelected.addEventListener('click', handleDeleteSelected); // Fix (batch select)
  /* Fix (bulk edit): event wiring — trigger, checkbox↔input enable/disable,
     Enter submits step 1, per-overlay traps/backdrop/Escape are handled below */
  el.btnEditSelected.addEventListener('click', handleEditSelected);
  el.bulkChkName.addEventListener('change', bulkToggleInputs);
  el.bulkChkLoc.addEventListener('change', bulkToggleInputs);
  el.bulkChkAmount.addEventListener('change', bulkToggleInputs);
  el.bulkChkCategory.addEventListener('change', bulkToggleInputs); // Fix (category)
  /* Fix (category dropdown): bulk Category is a <select> too (its options are refreshed in
     bulkResetFields); auto-capitalize now lives on the "new category" modal input. */
  setupCategorySelect(el.bulkInpCategory);
  [el.bulkInpName, el.bulkInpLoc, el.bulkInpAmount, el.bulkInpCategory].forEach(function(inp){
    inp.addEventListener('keydown', function(ev){
      if (ev.key === 'Enter' && !ev.isComposing){
        ev.preventDefault();
        if (catModalIsOpen()) return; // the "new category" modal owns Enter while it is open
        el.bulkContinue.click(); // Enter in a bulk field submits step 1 (mirrors the depot modal)
      }
    });
    inp.addEventListener('input', function(){ setInvalid(inp, false); }); // Fix (a11y audit C1): typing clears
  });
  el.bulkContinue.addEventListener('click', handleBulkContinue);
  el.bulkCancel1.addEventListener('click', closeBulk1);
  el.bulkApply.addEventListener('click', handleBulkApply);
  el.bulkCancel2.addEventListener('click', closeBulk2); // closes both steps (spec: simpler)
  el.bulkClose3.addEventListener('click', closeBulk3);
  [el.bulkOverlay1, el.bulkOverlay2, el.bulkOverlay3].forEach(function(ov){
    ov.addEventListener('click', function(ev){
      // backdrop click cancels the whole flow
      if (ev.target === ov){ ov.classList.add('hidden'); bulkPlan = null; bulkFocusAfterClose(); }
    });
    ov.addEventListener('keydown', bulkTabTrap); // a11y: Tab focus trap per visible overlay
  });
  /* Fix (new category modal): open/save/cancel, Tab trap, backdrop click, live Save state */
  el.catModalSave.addEventListener('click', saveCategoryModal);
  el.catModalCancel.addEventListener('click', cancelCategoryModal);
  el.catOverlay.addEventListener('click', function(ev){
    if (ev.target === el.catOverlay) cancelCategoryModal(); // backdrop click = cancel
  });
  el.catOverlay.addEventListener('keydown', function(ev){
    if (ev.key !== 'Tab') return;
    /* Disabled controls (the Save button before a name is typed) stay out of the trap. */
    var f = el.catOverlay.querySelectorAll('button:not([disabled]):not(.hidden),input:not([disabled]):not(.hidden)');
    if (!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if (ev.shiftKey){
      if (document.activeElement === first || document.activeElement === el.catOverlay){ ev.preventDefault(); last.focus(); }
    } else {
      if (document.activeElement === last){ ev.preventDefault(); first.focus(); }
    }
  });
  el.catModalInput.addEventListener('input', function(){
    autoCapitalizeFirst(el.catModalInput); // same first-letter rule as Name/Location/Category
    setInvalid(el.catModalInput, false);
    el.catModalSave.disabled = el.catModalInput.value.trim() === ''; // Save needs a non-empty name
  });
  el.catModalInput.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.isComposing){
      ev.preventDefault();
      saveCategoryModal(); // Enter confirms, like the other input modals
    }
  });
  /* Fix (settings): the gear opens the settings dialog; controls apply live */
  el.btnSettings.addEventListener('click', openSettings);
  el.setClose.addEventListener('click', closeSettings);
  el.settingsOverlay.addEventListener('click', function(ev){
    if (ev.target === el.settingsOverlay) closeSettings(); // backdrop = close
  });
  el.settingsOverlay.addEventListener('keydown', settingsTabTrap); // a11y: Tab focus trap
  el.setLang.addEventListener('change', onSettingsLangChange);
  el.setFont.addEventListener('change', onSettingsFontChange);
  el.setIcon.addEventListener('change', onSettingsIconChange);
  el.btnResetSettings.addEventListener('click', onResetSettings);
  el.btnExport.addEventListener('click', handleExport);
  el.btnImportTrigger.addEventListener('click', function(){
    try { el.inpImport.click(); } catch(e){}
  });
  el.inpImport.addEventListener('change', function(){
    if (el.inpImport.files && el.inpImport.files[0]){
      handleImportFile(el.inpImport.files[0]);
    }
    el.inpImport.value = ''; // allow re-selecting the same file later
  });
  el.modalOk.addEventListener('click', function(){ closeConfirm(true); });
  el.modalCancel.addEventListener('click', function(){ closeConfirm(false); });
  el.modalInput.addEventListener('input', function(){ setInvalid(el.modalInput, false); }); // Fix (a11y audit C1): typing clears
  el.modalInput.addEventListener('keydown', function(ev){
    if (ev.key === 'Enter' && !ev.isComposing){
      ev.preventDefault();
      closeConfirm(true); // Save (value is read by askInput's resolver)
    }
  });
  el.overlay.addEventListener('click', function(ev){
    if (ev.target === el.overlay) closeConfirm(false); // backdrop click cancels
  });
  // Focus trap: Tab cycles within the modal while open (a11y)
  el.overlay.addEventListener('keydown', function(ev){
    if (ev.key !== 'Tab') return;
    var focusables = el.overlay.querySelectorAll('button:not([disabled]):not(.hidden),input:not([disabled]):not(.hidden)'); // Fix: exclude hidden controls from the trap (audit #11)
    if (!focusables.length) return;
    var first = focusables[0];
    var last = focusables[focusables.length - 1];
    if (ev.shiftKey){
      if (document.activeElement === first || document.activeElement === el.overlay){
        ev.preventDefault(); last.focus();
      }
    } else {
      if (document.activeElement === last){
        ev.preventDefault(); first.focus();
      }
    }
  });
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape'){
      if (!el.catOverlay.classList.contains('hidden')){
        /* Fix (new category modal): it is the topmost surface, so it closes first —
           the Category value is left untouched and focus returns to the dropdown. */
        cancelCategoryModal();
      } else if (!el.iconPickerOverlay.classList.contains('hidden')){
        closeIconPicker(); // Fix (depot icon picker): Escape closes, focus returns to the icon button
      } else if (bulkIsOpen()){
        // Fix (bulk edit): Escape closes whichever bulk step is visible (whole flow)
        if (!el.bulkOverlay1.classList.contains('hidden')) closeBulk1();
        else if (!el.bulkOverlay2.classList.contains('hidden')) closeBulk2();
        else closeBulk3();
      } else if (!el.overlay.classList.contains('hidden')){
        closeConfirm(false);
      } else if (!el.settingsOverlay.classList.contains('hidden')){
        closeSettings(); // Fix (settings): Escape closes the settings dialog
      } else if (depotMenuIsOpen()){
        closeDepotMenu();
        el.depotSelect.focus();
      } else if (!el.ksOverlay.classList.contains('hidden')){
        closeShortcuts();
      } else if (state.editingId !== null){
        // Fix (Phase 5): inline edit has priority over the Add/Import section — the
        // edit inputs' own Escape handlers cancel it (they stopPropagation)
      } else if (!el.formCard.classList.contains('hidden')){
        el.btnCloseForm.click(); // Fix (Phase 5): Escape closes the Add/Import section (same as the close button)
      }
    }
  });
  // ---- Depot icon picker (Fix: depot icon picker) ----
  el.btnDepotIcon.addEventListener('click', openIconPicker);
  el.iconPickerSave.addEventListener('click', savePendingIcon);   // Fix (save/cancel): commits the pending icon
  el.iconPickerCancel.addEventListener('click', closeIconPicker); // Fix (save/cancel): discards it
  el.iconPickerOverlay.addEventListener('click', function(ev){
    if (ev.target === el.iconPickerOverlay) closeIconPicker(); // backdrop click = Cancel
  });
  el.iconPickerOverlay.addEventListener('keydown', iconPickerKeydown); // trap + arrow grid nav
  // ---- Depot selector ----
  el.depotSelect.addEventListener('click', function(){
    if (depotMenuIsOpen()){ closeDepotMenu(); el.depotSelect.focus(); }
    else { openDepotMenu(); }
  });
  el.depotSelect.addEventListener('keydown', function(ev){
    if ((ev.key === 'ArrowDown' || ev.key === 'ArrowUp') && !depotMenuIsOpen()){
      ev.preventDefault();
      openDepotMenu();
    }
  });
  el.depotMenu.addEventListener('keydown', function(ev){
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp'){
      ev.preventDefault();
      var names = Array.prototype.slice.call(el.depotMenu.querySelectorAll('.dd-name'));
      if (!names.length) return;
      var idx = names.indexOf(document.activeElement);
      var next;
      if (ev.key === 'ArrowDown') next = (idx === -1) ? 0 : Math.min(names.length - 1, idx + 1);
      else next = (idx === -1) ? names.length - 1 : Math.max(0, idx - 1);
      names[next].focus();
    }
  });
  document.addEventListener('click', function(ev){
    if (depotMenuIsOpen() &&
        !el.depotMenu.contains(ev.target) &&
        !el.depotSelect.contains(ev.target)){
      closeDepotMenu();
    }
  });
}

function init(){
  // Bootstrap check: translations must have loaded from translations.js
  if (!languagesValid(window.DEPOT_LANGUAGES)){
    el.appRoot.classList.add('hidden');
    el.bootstrapError.classList.remove('hidden');
    return; // app stays inert; message is intentionally hardcoded English
  }
  checkStorage();
  state.lang = detectLang(); // runs BEFORE data load so migration can pick the language
  /* Fix (settings): load the saved scales (the head script already applied them pre-paint;
     this syncs state and guarantees the values are applied on every start) */
  state.fontScale = readScale(LS_FONT);
  state.iconScale = readScale(LS_ICON);
  applyFontScale(state.fontScale);
  applyIconScale(state.iconScale);
  var loaded = { ok: true, empty: true };
  if (DC.store.ok){
    loaded = loadState();
  } else {
    el.banner.textContent = t('storageWarn');
    el.banner.classList.remove('hidden');
  }
  if (loaded.ok && loaded.data){
    state.depots = loaded.data.depots;
    state.activeDepotId = loaded.data.activeDepotId;
    state.nextDepotId = loaded.data.nextDepotId;
    state.nextItemId = loaded.data.nextItemId;
    /* Fix (depot icon picker): old data/snapshots without the map load as {} */
    state.depotIcons = (loaded.data.depotIcons && typeof loaded.data.depotIcons === 'object') ? loaded.data.depotIcons : {};
    syncItemsRef();
    if (loaded.migrated){
      persist(); snapshotCurrentData(); // write the migrated v2 state immediately
    }
  } else if (!loaded.ok){
    setTimeout(function(){ showToast(t('corruptWarn'), 'warn'); announce(t('corruptWarn'), true); }, 400);
  }
  if (state.depots.length === 0){
    // Fresh start (or everything deleted): create the default depot
    state.depots = [{ id: 1, name: t('defaultDepotName'), items: [] }];
    state.activeDepotId = 1;
    state.nextDepotId = 2;
    state.nextItemId = 1;
    syncItemsRef();
    persist(); // make the fresh state durable right away
  }
  bindEvents();
  applyTheme(currentTheme()); // sync switch state with the active theme
  render();
  applyFavicon(); // Fix (depot icon picker): favicon from the active depot's emoji on load
  try { el.inpSearch.focus(); } catch(e){} // start typing a search right away
}
init();
})();
</script>
